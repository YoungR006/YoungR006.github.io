<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young rich</title>
<!-- JSZip 支持解析 .xmind -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- KaTeX 支持解析与渲染 LaTeX 公式 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<style>
/* ===== 全局基础 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0a0a1a; color: #fff; overflow: hidden; height: 100vh; width: 100vw;
}
#app { width: 100%; height: 100%; }

/* ===== 上传页 ===== */
#uploadPage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; padding: 40px;
}
.brand { text-align: center; margin-bottom: 40px; }
.brand h1 {
  font-size: 32px; font-weight: 800;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { font-size: 14px; color: #64748b; margin-top: 6px; }
.upload-box {
  border: 2px dashed #3a3a5c; border-radius: 20px; padding: 50px 60px;
  text-align: center; cursor: pointer; transition: all 0.3s;
  background: rgba(255,255,255,0.02); max-width: 480px; width: 100%;
}
.upload-box:hover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
.upload-box.dragover { border-color: #818cf8; background: rgba(99,102,241,0.1); }
.upload-icon { font-size: 40px; margin-bottom: 12px; }
.upload-title { font-size: 18px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; }
.upload-desc { font-size: 13px; color: #94a3b8; }
.upload-hint { margin-top: 20px; font-size: 12px; color: #475569; }
input[type="file"] { display: none; }
#loadingArea, #errorArea { margin-top: 24px; display: none; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.spinner {
  width: 36px; height: 36px; border: 3px solid rgba(99,102,241,0.2);
  border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  padding: 14px 20px; background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2); border-radius: 10px;
  color: #fca5a5; font-size: 13px; max-width: 480px;
}

/* ===== 预览页 ===== */
#previewPage { display: none; flex-direction: column; height: 100%; }
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: rgba(15,15,35,0.95);
  border-bottom: 1px solid #1e1e3f; backdrop-filter: blur(10px); flex-shrink: 0;
}
.toolbar-left { display: flex; align-items: center; gap: 12px; }
.toolbar-title {
  font-size: 15px; font-weight: 600; color: #e2e8f0;
  max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.toolbar-info { font-size: 11px; color: #475569; margin-left: 4px; }
.btn {
  padding: 7px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;
}
.btn-primary { background: #6366f1; color: white; }
.btn-primary:hover { background: #818cf8; }
.btn-secondary { background: rgba(255,255,255,0.08); color: #cbd5e1; }
.btn-secondary:hover { background: rgba(255,255,255,0.12); }
.btn-danger { background: rgba(239,68,68,0.15); color: #fca5a5; }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }

.preview-body {
  flex: 1; overflow: auto; position: relative; background: #0f0f23; padding: 40px;
}
.mindmap-tree {
  display: flex; align-items: flex-start; justify-content: flex-start;
  min-width: fit-content; min-height: fit-content; padding: 20px 0;
}

/* ===== 预览右向层次树 ===== */
.tree-node { display: flex; align-items: center; position: relative; }
.node-card {
  padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500;
  color: #e2e8f0; white-space: nowrap; max-width: 380px;
  overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 2;
  cursor: default; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
}
.node-card:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.node-card.level-0 {
  background: #6366f1; color: white; font-size: 20px; font-weight: 700;
  padding: 16px 28px; box-shadow: 0 4px 24px rgba(99,102,241,0.35); border-radius: 12px;
}
.node-card.level-1 {
  font-size: 15px; background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.2);
  box-shadow: 0 2px 12px rgba(168,85,247,0.08);
}
.node-card.level-2 {
  font-size: 13px; background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.12); color: #cbd5e1;
}
.node-card.level-3 {
  font-size: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: #94a3b8;
}
.child-count-badge {
  font-size: 10px; background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8);
  padding: 1px 7px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
}
.node-children {
  display: flex; flex-direction: column; gap: 14px; margin-left: 70px; position: relative;
}
.node-children::before {
  content: ''; position: absolute; left: -35px; top: 50%; width: 35px; height: 2px;
  transform: translateY(-50%); background: linear-gradient(90deg, #6366f1, #3a3a5c); border-radius: 1px;
}
.node-children .tree-node::before {
  content: ''; position: absolute; left: -35px; top: 50%; width: 35px; height: 2px;
  transform: translateY(-50%); background: #3a3a5c; border-radius: 1px;
}
.node-children .tree-node::after {
  content: ''; position: absolute; left: -35px; top: 0; bottom: 0; width: 2px; background: #3a3a5c;
}
.node-children .tree-node:first-child::after { top: 50%; }
.node-children .tree-node:last-child::after { bottom: 50%; }
.node-children .tree-node:only-child::after { display: none; }

/* ===== 演示页 ===== */
#pitchPage {
  display: none; position: fixed; inset: 0; background: #0a0a1a; z-index: 9999; overflow: hidden;
}

/* ===== 悬浮在左侧的控制栏 ===== */
.pitch-top-controls {
  position: fixed; top: 50px; left: 20px; z-index: 100;
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  padding: 12px; width: 145px;
  background: rgba(12, 12, 30, 0.92); border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px; backdrop-filter: blur(16px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto;
}
.control-divider { width: 100%; height: 1px; background: rgba(255,255,255,0.08); margin: 2px 0; }
.control-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.speed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; }

/* 速度按钮 */
.speed-btn {
  padding: 3px 0; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04); color: #94a3b8; cursor: pointer;
  font-size: 10px; transition: all 0.2s; font-weight: 500; text-align: center;
}
.speed-btn.active, .speed-btn:hover { background: #6366f1; border-color: #6366f1; color: white; }
.speed-btn:hover:not(.active) { background: rgba(99,102,241,0.3); }
.auto-play-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #10b981;
  animation: pulse-dot 1.2s ease-in-out infinite; display: inline-block; margin-right: 3px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.8); }
}

/* ===== 演示树视口 ===== */
.pitch-viewport {
  position: absolute; top: 0; left: 180px; bottom: 64px;
  overflow: auto; scroll-behavior: smooth;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.pitch-viewport::-webkit-scrollbar { width: 6px; height: 6px; }
.pitch-viewport::-webkit-scrollbar-track { background: transparent; }
.pitch-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.pitch-tree {
  display: flex; align-items: flex-start;
  min-width: fit-content; min-height: 100%;
  padding: 40px 40px;
}

/* ===== Pitch Slide Panel（右侧独立演示面板）===== */
.pitch-slide-panel {
  position: absolute; top: 0; right: 0; bottom: 64px;
  background: rgba(12,12,30,0.97); border-left: 1px solid #1e1e3f;
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 60px 28px 40px;
  z-index: 20; overflow-y: auto; backdrop-filter: blur(10px);
}
/* 面板拖拽调节把手 */
.panel-resize-handle {
  position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
  cursor: col-resize; z-index: 25; background: transparent;
  transition: background 0.2s;
}
.panel-resize-handle:hover,
.panel-resize-handle.active { background: rgba(99,102,241,0.4); }
.psp-breadcrumb {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 32px; font-size: 12px; color: #64748b; flex-wrap: wrap;
}
.psp-title {
  font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 24px;
  color: #f1f5f9; text-align: center; word-break: break-word; width: 100%;
}
.psp-title.root-title {
  font-size: 36px;
  background: linear-gradient(135deg, #e2e8f0, #94a3b8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.psp-subtitle { font-size: 14px; color: #64748b; margin-top: -16px; margin-bottom: 24px; }
.psp-children {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  width: 100%; margin-bottom: 20px;
}
.psp-child-card {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 12px 20px; font-size: 15px; color: #cbd5e1;
  backdrop-filter: blur(10px); transition: all 0.25s; word-break: break-word;
  max-width: 380px; cursor: default; position: relative; overflow: hidden;
}
.psp-child-card:hover {
  background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.25);
  transform: translateY(-2px);
}
.psp-note-area {
  width: 100%; margin-top: 20px; font-size: 14px; color: #94a3b8; line-height: 1.7;
  text-align: center; padding: 12px 20px;
  background: rgba(255,255,255,0.02); border-radius: 10px; position: relative; overflow: hidden;
}
.psp-empty-hint { color: #334155; font-size: 13px; margin-top: 24px; }

/* ===== 搜索 ===== */
.search-group { display: flex; align-items: center; gap: 2px; position: relative; }
.search-input {
  width: 100px; padding: 5px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
  color: #e2e8f0; font-size: 12px; outline: none; transition: border 0.2s;
}
.search-input:focus { border-color: #f59e0b; width: 150px; }
.search-input::placeholder { color: #475569; }
.search-count {
  font-size: 10px; color: #64748b; position: absolute; right: 4px; top: -14px;
  pointer-events: none; white-space: nowrap;
}
.search-highlight {
  outline: 2px solid #f59e0b !important;
  outline-offset: 3px;
  border-radius: 4px;
}

/* ===== 缩放 ===== */
.zoom-group { display: flex; align-items: center; gap: 2px; }
.zoom-btn {
  width: 26px; height: 26px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
  color: #94a3b8; cursor: pointer; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; line-height: 1;
}
.zoom-btn:hover { background: rgba(255,255,255,0.1); color: white; }
.zoom-label {
  font-size: 11px; color: #94a3b8; min-width: 36px; text-align: center;
  cursor: pointer; user-select: none;
}
.zoom-label:hover { color: white; }

/* 树节点 */
.pt-node { display: flex; align-items: center; position: relative; }
.pt-card-wrapper {
  position: relative; flex-shrink: 0; cursor: pointer;
  transition: transform 0.25s ease; border-radius: 12px; overflow: hidden;
}
.pt-card-wrapper:hover { transform: scale(1.03); }
.pt-card {
  padding: 12px 22px; border-radius: 12px; font-weight: 600; color: #e2e8f0;
  white-space: nowrap; max-width: 400px; overflow: hidden; text-overflow: ellipsis;
  transition: all 0.3s ease; position: relative; z-index: 2;
}
.pt-card.lv-0 {
  font-size: 22px; padding: 18px 32px; background: #6366f1; color: white;
  box-shadow: 0 4px 28px rgba(99,102,241,0.4); border-radius: 14px;
}
.pt-card.lv-1 {
  font-size: 16px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.25);
}
.pt-card.lv-2 {
  font-size: 14px; background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.15);
}
.pt-card.lv-3 {
  font-size: 13px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.12); color: #cbd5e1;
}
.pt-card.lv-4 {
  font-size: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #94a3b8;
}

/* ===== 黑色幕布系统 ===== */
.pt-card-wrapper.is-blackened::after {
  content: ''; position: absolute; inset: 0; background: #000000;
  border-radius: inherit; z-index: 8; transition: opacity 0.3s ease;
  pointer-events: auto;
}

.coverable { position: relative; }
.cover-overlay {
  position: absolute; inset: 0; background: #000000; border-radius: inherit;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 9; transition: all 0.3s ease;
  opacity: 1; pointer-events: auto;
}
.cover-overlay.hidden { opacity: 0; pointer-events: none; }

/* 焦点高亮 */
.pt-card-wrapper.focused { z-index: 10; }
.pt-card-wrapper.focused .pt-card {
  animation: focusGlow 1.5s ease-in-out infinite; z-index: 10;
}
@keyframes focusGlow {
  0%, 100% { box-shadow: 0 0 16px rgba(99,102,241,0.5), 0 0 40px rgba(99,102,241,0.2); }
  50% { box-shadow: 0 0 28px rgba(99,102,241,0.8), 0 0 60px rgba(99,102,241,0.4); }
}

.pt-note {
  font-size: 11px; color: #64748b; font-weight: 400; margin-top: 4px;
  max-width: 320px; white-space: normal; line-height: 1.4;
}
.pt-badge {
  display: inline-block; font-size: 10px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
  padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-weight: 500;
}

/* 树子节点列 */
.pt-children {
  display: flex; flex-direction: column; gap: 16px;
  margin-left: 50px; position: relative;
}
.pt-children::before {
  content: ''; position: absolute; left: -25px; top: 50%;
  width: 25px; height: 2px; transform: translateY(-50%);
  background: rgba(255,255,255,0.12); border-radius: 1px;
}
.pt-children > .pt-node::before {
  content: ''; position: absolute; left: -25px; top: 50%;
  width: 25px; height: 2px; transform: translateY(-50%);
  background: rgba(255,255,255,0.12); border-radius: 1px;
}
.pt-children > .pt-node::after {
  content: ''; position: absolute; left: -25px; top: 0; bottom: 0;
  width: 2px; background: rgba(255,255,255,0.12);
}
.pt-children > .pt-node:first-child::after { top: 50%; }
.pt-children > .pt-node:last-child::after { bottom: 50%; }
.pt-children > .pt-node:only-child::after { display: none; }

.cover-mode-indicator {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5; padding: 6px 18px; border-radius: 20px;
  font-size: 12px; font-weight: 600; z-index: 100; pointer-events: none;
  display: none; animation: fadeInDown 0.3s ease;
}
.cover-mode-indicator.active { display: block; }

/* ===== 涂鸦 ===== */
#drawCanvas {
  position: fixed; inset: 0; z-index: 45; pointer-events: none; cursor: crosshair;
}
#drawCanvas.active { pointer-events: auto; }
.draw-toolbar {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 6px;
  padding: 8px 16px; background: rgba(15, 15, 35, 0.96);
  border: 1px solid #1e1e3f; border-radius: 14px;
  backdrop-filter: blur(12px); z-index: 55;
}
.draw-toolbar.active { display: flex; animation: fadeInUp 0.3s ease; }
.draw-tool-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent;
  background: rgba(255,255,255,0.06); color: #94a3b8; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.2s;
}
.draw-tool-btn:hover { background: rgba(255,255,255,0.12); color: white; }
.draw-tool-btn.active { background: rgba(99,102,241,0.2); border-color: #6366f1; color: white; }
.draw-color-dot {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all 0.2s;
}
.draw-color-dot:hover, .draw-color-dot.active { border-color: white; transform: scale(1.2); }
.draw-size-dot {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: #94a3b8; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; transition: all 0.2s;
}
.draw-size-dot:hover, .draw-size-dot.active { background: rgba(99,102,241,0.2); border-color: #6366f1; color: white; }
.draw-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.08); }

/* ===== 测验面板 ===== */
.quiz-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 20px 32px 28px;
  background: linear-gradient(to top, rgba(10,10,26,0.98), rgba(10,10,26,0.9) 60%, transparent);
  z-index: 70; display: none; flex-direction: column; align-items: center; gap: 14px;
}
.quiz-panel.active { display: flex; animation: quizSlideUp 0.4s ease; }
@keyframes quizSlideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.quiz-progress { font-size: 13px; color: #64748b; }
.quiz-progress strong { color: #818cf8; }
.quiz-hint-area {
  padding: 18px 40px; background: rgba(99,102,241,0.05);
  border: 1px dashed rgba(99,102,241,0.25); border-radius: 14px;
  color: #94a3b8; font-size: 15px; cursor: pointer; transition: all 0.3s; text-align: center;
}
.quiz-hint-area:hover { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.5); color: #cbd5e1; }

/* ===== 标签系统 ===== */
.tag-input {
  width: 100%; padding: 5px 8px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
  color: #e2e8f0; font-size: 11px; outline: none; transition: border 0.2s;
}
.tag-input:focus { border-color: #6366f1; }
.tag-input::placeholder { color: #475569; }
.tag-panel {
  position: fixed; top: 60px; left: 180px; width: 260px; max-height: 420px;
  overflow-y: auto; background: rgba(15, 15, 35, 0.97);
  border: 1px solid #1e1e3f; border-radius: 12px; padding: 14px;
  z-index: 80; display: none; backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.tag-panel.open { display: block; animation: fadeInDown 0.2s ease; }
.tag-panel-title { font-size: 12px; color: #64748b; margin-bottom: 10px; font-weight: 600; }
.tag-panel-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 13px;
}
.tag-panel-item:hover { background: rgba(255,255,255,0.06); }
.tag-panel-slide { color: #94a3b8; font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-panel-empty { color: #475569; font-size: 12px; text-align: center; padding: 24px 0; }

.node-tags {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; justify-content: center;
}
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px;
  background: rgba(99,102,241,0.18); color: #a5b4fc;
  font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s;
}
.tag-chip:hover { background: rgba(99,102,241,0.3); transform: translateY(-1px); }
.tag-chip .tag-remove { font-size: 12px; opacity: 0.5; margin-left: 2px; cursor: pointer; line-height: 1; }
.tag-chip .tag-remove:hover { opacity: 1; color: #fca5a5; }

/* ===== 底部控制栏 ===== */
.pitch-controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 32px; display: flex; align-items: center; justify-content: space-between;

/* 右下角导航按钮 */

/* KaTeX 渲染节点调整 */

/* ===== 响应式适配 ===== */
@media (max-width: 768px) {

  }
}
</style>

<script>
// ======================================================================
//  STATE
// ======================================================================
let currentData = null;
let slides = [];
let currentFocus = 0;
let totalNodes = 0;
let fileName = '';
let isInPitch = false;

let visitedNodes = new Set();

let isAutoPlaying = false;
let autoPlaySpeed = 1;
let autoPlayTimerId = null;
const BASE_INTERVAL = 3000;

let coverMode = false;
let brainstormMode = false;
let drawingState = { tool: 'pen', color: '#ff4444', size: 3 };
let isDrawing = false;
let drawCanvas = null;
let drawCtx = null;
let lastPos = { x: 0, y: 0 };

let quizMode = false;
let quizPool = [];
let quizReviewed = new Set();
let quizAnswerRevealed = false;

let slideTags = {};
let tagPanelOpen = false;

// Feature: Search
let searchMatches = [];
let searchMatchIdx = -1;

// Feature: Zoom
let zoomLevel = 1.0;
const ZOOM_MIN = 0.3;
const ZOOM_MAX = 3.0;
const ZOOM_STEP = 0.15;

// ======================================================================
//  LATEX & TEXT RENDERER
// ======================================================================
function renderContent(text) {
  if (!text) return '';
  text = text.trim();

  // 含中文但非 LaTeX 公式块 → 纯文本，不做任何公式变换
  if (/[一-鿿]/.test(text) && !/\\begin|\\end/.test(text)) {
    return escapeHtml(text);
  }

  // 检查是否包含 LaTeX 关键字或数学公式标记
  const hasLatex = /\\(frac|begin|cases|text|le|ge|times|sum|int|sqrt|alpha|beta|infty)|[\^_]\{|=\\frac|\$/.test(text);

  if (hasLatex && typeof katex !== 'undefined') {
    try {
      let latexStr = text;
      if (latexStr.startsWith('$') && latexStr.endsWith('$')) {
        latexStr = latexStr.replace(/^\$+|\$+$/g, '');
      }
      // 修复：全角括号/逗号在 LaTeX 公式中会导致解析失败，转半角
      // 但 \text{...} 内部的保留不动（KaTeX 支持 \text 内中文）
      latexStr = latexStr.replace(/（/g, '(').replace(/）/g, ')');
      return katex.renderToString(latexStr, {
        throwOnError: false,
        displayMode: text.includes('\\begin') || text.includes('\\frac')
      });
    } catch (e) {
      console.warn("KaTeX Error: ", e);
      return escapeHtml(text);
    }
  }
  return escapeHtml(text);
}

// ======================================================================
//  FILE HANDLING & PARSERS
// ======================================================================
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');

uploadBox.addEventListener('click', () => fileInput.click());
uploadBox.addEventListener('dragover', (e) => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
uploadBox.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadBox.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });

async function handleFile(file) {
  const name = file.name.toLowerCase();
  if (!name.endsWith('.xmind') && !name.endsWith('.txt')) {
    showError('请选择 .xmind 或 .txt 格式的文件');
    return;
  }
  fileName = file.name.replace(/\.(xmind|txt)$/i, '');
  document.getElementById('loadingArea').style.display = 'flex';
  document.getElementById('errorArea').style.display = 'none';

  try {
    let data;
    if (name.endsWith('.txt')) {
      const text = await file.text();
      data = parseTXT(text);
    } else {
      data = await parseXMind(file);
    }
    currentData = data;
    resetAllState();
    renderPreview(data);
    generateSlides(data);
    showPreview();
  } catch (err) {
    showError('解析失败：' + err.message);
    console.error(err);
  } finally {
    document.getElementById('loadingArea').style.display = 'none';
  }
}

function showError(msg) {
  const el = document.getElementById('errorArea');
  el.textContent = msg;
  el.style.display = 'block';
}

/* 解析 XMIND */
async function parseXMind(file) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip 库加载失败，请检查网络');
  const zip = await JSZip.loadAsync(file);
  let contentFile = zip.file('content.json');
  if (!contentFile) {
    const files = Object.keys(zip.files);
    const contentPath = files.find(f => f.endsWith('content.json'));
    if (contentPath) contentFile = zip.file(contentPath);
  }
  if (!contentFile) throw new Error('找不到 content.json，可能是不支持的格式');
  const content = await contentFile.async('string');
  const parsed = JSON.parse(content);
  return Array.isArray(parsed) ? parsed[0] : parsed;
}

/* 自动清理末尾斜杠，并识别公式自动补全 $ */
function autoFormatNodeText(text) {
  if (!text) return '';
  let cleaned = text.replace(/\\+\s*$/, '').trim();

  // 含中文 → 说明性文字，不自动包裹公式（避免把 S_w, S_R 等变量名错误包成 $...$）
  if (/[一-鿿㐀-䶿]/.test(cleaned)) {
    return cleaned;
  }

  if (cleaned.includes('$')) {
    return cleaned;
  }

  const mathPattern = /([a-zA-Z0-9_\^\+\-\*\/\=\(\)\{\}\\]*[\_\^\\][a-zA-Z0-9_\^\+\-\*\/\=\(\)\{\}\\]*)/g;
  return cleaned.replace(mathPattern, (match) => {
    if (/[\_\^\\]/.test(match)) {
      return `$${match}$`;
    }
    return match;
  });
}

/* 解析 TXT / Markdown 树形文档 */
function parseTXT(txtContent) {
  const lines = txtContent.split(/\r?\n/);
  const root = { title: fileName || '未命名文本', children: { attached: [] } };
  
  // 预处理合并多行 LaTeX (如 \begin{cases} ... \end{cases})
  const processedLines = [];
  let inFormula = false;
  let formulaBuffer = [];

  for (let line of lines) {
    const trimmed = line.trim();
    if (trimmed.includes('\\begin{')) {
      inFormula = true;
      formulaBuffer.push(trimmed);
      continue;
    }
    if (inFormula) {
      formulaBuffer.push(trimmed);
      if (trimmed.includes('\\end{')) {
        inFormula = false;
        processedLines.push(formulaBuffer.join(' '));
        formulaBuffer = [];
      }
      continue;
    }
    if (line.length > 0) {
      processedLines.push(line);
    }
  }

  // 构建树算法 (依赖缩进和 Markdown 级数)
  let stack = [{ level: -1, node: root }];
  let isFirstNode = true;

  for (let line of processedLines) {
    if (!line.trim()) continue;

    let raw = line;
    let trimmed = raw.trim();
    let level = 0;
    let content = trimmed;

    // 支持 Markdown # 标题判断
    const headerMatch = trimmed.match(/^(#+)\s*(.*)/);
    if (headerMatch) {
      level = headerMatch[1].length - 1;
      content = headerMatch[2];
    } else {
      // 通过空格/Tab缩进判断层级
      const indentMatch = raw.match(/^(\s*)/);
      const spaceCount = indentMatch ? indentMatch[1].replace(/\t/g, '  ').length : 0;
      content = trimmed.replace(/^[-*+]\s*/, '').replace(/^###\s*/, '');
      level = 1 + Math.floor(spaceCount / 2);

      // 续行处理：无缩进、无标记、非#开头 → 与前一个节点同级（不是新根级）
      if (spaceCount === 0 && !trimmed.match(/^(#|[-*+])/) && stack.length > 1 && !isFirstNode) {
        level = stack[stack.length - 1].level;
      }
    }

    if (!content.trim()) continue;
    
    // 自动清洗与公式转换
    content = autoFormatNodeText(content.trim());

    const newNode = { title: content, children: { attached: [] } };

    if (isFirstNode) {
      root.title = content;
      stack[0].node = root;
      stack[0].level = level;
      isFirstNode = false;
      continue;
    }

    // 寻找最近的父级
    while (stack.length > 1 && stack[stack.length - 1].level >= level) {
      stack.pop();
    }

    const parent = stack[stack.length - 1].node;
    if (!parent.children) parent.children = { attached: [] };
    if (!parent.children.attached) parent.children.attached = [];
    parent.children.attached.push(newNode);

    stack.push({ level: level, node: newNode });
  }

  return { rootTopic: root };
}

function resetAllState() {
  stopAutoPlay();
  exitCoverMode();
  exitBrainstormMode();
  exitQuizMode();
  slideTags = {};
  tagPanelOpen = false;
  visitedNodes = new Set();
  document.getElementById('tagPanel').classList.remove('open');
  document.getElementById('tagPanelContent').innerHTML = '';
  document.getElementById('tagInput').value = '';
  if (drawCtx && drawCanvas) { drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); }
  zoomReset();
}

// ======================================================================
//  PREVIEW TREE
// ======================================================================
function buildTreeHTML(topic, depth = 0) {
  const title = (topic.title || '无标题').trim();
  const children = topic.children?.attached || [];
  const hasChildren = children.length > 0;

  let cls = 'tree-node';
  if (depth === 0) cls += ' node-root';
  else if (hasChildren) cls += ' node-branch';
  else cls += ' node-leaf';

  const cardCls = `level-${Math.min(depth, 3)}`;

  let html = `<div class="${cls}" data-level="${depth}">`;
  html += `<div class="node-card ${cardCls}">${renderContent(title)}`;
  if (hasChildren) html += `<span class="child-count-badge">${children.length}</span>`;
  html += '</div>';
  if (hasChildren) {
    html += '<div class="node-children">';
    children.forEach(child => { html += buildTreeHTML(child, depth + 1); });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderPreview(sheet) {
  const rootTopic = sheet.rootTopic;
  const rootTitle = (rootTopic.title || fileName || '未命名导图').trim();
  document.getElementById('previewTitle').innerHTML = renderContent(rootTitle);
  let nodeCount = 0;
  function count(n) { nodeCount++; (n.children?.attached || []).forEach(count); }
  count(rootTopic);
  function maxDepth(n) {
    const ch = n.children?.attached || [];
    return ch.length === 0 ? 1 : 1 + Math.max(...ch.map(maxDepth));
  }
  document.getElementById('previewInfo').textContent = `· ${nodeCount} 个节点 · ${maxDepth(rootTopic)} 层`;
  document.getElementById('mindmapTree').innerHTML = buildTreeHTML(rootTopic);
}

// ======================================================================
//  PITCH TREE: Build
// ======================================================================
let pitchNodeIndex = 0;

function buildPitchTreeHTML(topic, depth = 0) {
  const idx = pitchNodeIndex++;
  const title = (topic.title || '无标题').trim();
  const children = topic.children?.attached || [];
  const hasChildren = children.length > 0;
  const note = (topic.notes?.plain?.content || '').trim();
  const lvCls = `lv-${Math.min(depth, 4)}`;

  let html = `<div class="pt-node" data-node-index="${idx}" data-depth="${depth}">`;

  html += `<div class="pt-card-wrapper coverable" id="pt-node-${idx}" data-node="${idx}" data-depth="${depth}">`;
  html += `<div class="pt-card ${lvCls}">`;
  html += renderContent(title);
  if (hasChildren) html += `<span class="pt-badge">${children.length}</span>`;
  html += '</div>';
  if (note) html += `<div class="pt-note">${renderContent(note)}</div>`;
  html += `<div class="cover-overlay hidden"></div>`;
  html += '</div>';

  if (hasChildren) {
    html += '<div class="pt-children">';
    children.forEach(child => { html += buildPitchTreeHTML(child, depth + 1); });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderPitchTree(sheet) {
  pitchNodeIndex = 0;
  const rootTopic = sheet.rootTopic;
  const html = buildPitchTreeHTML(rootTopic);
  document.getElementById('pitchTree').innerHTML = html;
  totalNodes = pitchNodeIndex;
}

// ======================================================================
//  PITCH TREE: Focus & Visited Management
// ======================================================================
function focusPitchNode(index) {
  if (index < 0 || index >= totalNodes) return;

  visitedNodes.add(index);
  updateBlacknessState();

  const prev = document.querySelector('.pt-card-wrapper.focused');
  if (prev) prev.classList.remove('focused');

  const el = document.getElementById(`pt-node-${index}`);
  if (!el) return;
  el.classList.add('focused');
  currentFocus = index;

  el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });

  document.getElementById('pitchPageNum').textContent = `${index + 1} / ${totalNodes}`;
  document.getElementById('pitchProgress').style.width = `${((index + 1) / totalNodes) * 100}%`;
  document.getElementById('btnPrev').disabled = index === 0;
  document.getElementById('btnNext').disabled = index === totalNodes - 1;

  syncNodeTagsToDOM(index);
  updatePitchPanel(index);
  updatePitchHint();
}

function updateBlacknessState() {
  document.querySelectorAll('#pitchTree .pt-card-wrapper').forEach(wrapper => {
    const idx = parseInt(wrapper.getAttribute('data-node'));
    if (!isNaN(idx)) {
      if (visitedNodes.has(idx)) {
        wrapper.classList.remove('is-blackened');
      } else {
        wrapper.classList.add('is-blackened');
      }
    }
  });
}

function unblackAll() {
  for (let i = 0; i < totalNodes; i++) {
    visitedNodes.add(i);
  }
  updateBlacknessState();
}

function updatePitchPanel(index) {
  if (index < 0 || index >= slides.length) return;
  const slide = slides[index];

  const breadEl = document.getElementById('pspBreadcrumb');
  if (slide.path.length > 0) {
    breadEl.innerHTML = slide.path.map(p => renderContent(p)).join(' <span style="color:#475569">/</span> ');
    breadEl.style.display = '';
  } else {
    breadEl.style.display = 'none';
  }

  const titleEl = document.getElementById('pspTitle');
  titleEl.innerHTML = renderContent(slide.title);
  titleEl.className = slide.isRoot ? 'psp-title root-title' : 'psp-title';

  const subEl = document.getElementById('pspSubtitle');
  if (slide.isRoot && slide.children.length > 0) {
    subEl.textContent = `${slide.children.length} 个分支主题`;
    subEl.style.display = '';
  } else {
    subEl.style.display = 'none';
  }

  const childrenEl = document.getElementById('pspChildren');
  if (slide.children.length > 0) {
    let cardsHtml = '';
    slide.children.forEach((child, j) => {
      cardsHtml += `<div class="psp-child-card coverable" id="psp-child-${j}" data-psp-child="${j}">
        <div>${renderContent(child)}</div>
        <div class="cover-overlay hidden"></div>
      </div>`;
    });
    childrenEl.innerHTML = cardsHtml;
    childrenEl.style.display = '';
    document.getElementById('pspEmpty').style.display = 'none';
  } else {
    childrenEl.innerHTML = '';
    childrenEl.style.display = 'none';
    document.getElementById('pspEmpty').style.display = slide.isRoot ? '' : 'none';
  }

  const noteArea = document.getElementById('pspNoteArea');
  const noteText = document.getElementById('pspNoteText');
  if (slide.note) {
    noteText.innerHTML = renderContent(slide.note);
    noteArea.style.display = '';
  } else {
    noteArea.style.display = 'none';
  }
}

function getFocusedNodeEl() {
  const cardEl = document.getElementById(`pt-node-${currentFocus}`);
  if (!cardEl) return null;
  return cardEl.closest('.pt-node');
}

function nextSlide() { if (currentFocus + 1 < totalNodes) focusPitchNode(currentFocus + 1); }
function prevSlide() { if (currentFocus - 1 >= 0) focusPitchNode(currentFocus - 1); }

function focusNextSibling() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  const next = nodeEl.nextElementSibling;
  if (next && next.classList.contains('pt-node')) {
    const idx = parseInt(next.getAttribute('data-node-index'));
    if (!isNaN(idx)) focusPitchNode(idx);
  }
}

function focusPrevSibling() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  const prev = nodeEl.previousElementSibling;
  if (prev && prev.classList.contains('pt-node')) {
    const idx = parseInt(prev.getAttribute('data-node-index'));
    if (!isNaN(idx)) focusPitchNode(idx);
  }
}

function focusParent() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  const parentChildren = nodeEl.parentElement;
  if (!parentChildren || !parentChildren.classList.contains('pt-children')) return;
  const parentNode = parentChildren.parentElement;
  if (!parentNode || !parentNode.classList.contains('pt-node')) return;
  const idx = parseInt(parentNode.getAttribute('data-node-index'));
  if (!isNaN(idx)) focusPitchNode(idx);
}

function updatePitchHint() {
  const hint = document.getElementById('pitchHint');
  if (quizMode) hint.textContent = '测验模式 · ESC 退出';
  else if (coverMode) hint.textContent = '遮盖模式 · 点击节点切换黑幕 · ESC 退出';
  else if (brainstormMode) hint.textContent = '涂鸦模式 · ESC 退出涂鸦';
  else if (isAutoPlaying) hint.textContent = '自动播放中 · 手动操作暂停';
  else hint.textContent = '空格/→ 下一步 · ↑↓ 切换同级 · ← 回父节点 · 点击节点聚焦去黑 · ESC 退出';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ======================================================================
//  SLIDES ARRAY
// ======================================================================
function generateSlides(sheet) {
  slides = [];
  function traverse(node, path = []) {
    const title = (node.title || '无标题').trim();
    const children = node.children?.attached || [];
    const note = node.notes?.plain?.content || '';
    slides.push({
      title,
      path: path.map(p => (p.title || '无标题').trim()),
      level: path.length,
      isRoot: path.length === 0,
      children: children.map(c => (c.title || '无标题').trim()).filter(t => t),
      note: note.trim()
    });
    children.forEach(child => traverse(child, [...path, node]));
  }
  traverse(sheet.rootTopic);
}

// ======================================================================
//  PAGE SWITCHING
// ======================================================================
function startPitch() {
  isInPitch = true;
  renderPitchTree(currentData);
  visitedNodes = new Set([0]);

  document.getElementById('pitchPage').style.display = 'block';
  applyPanelWidth();
  initPanelResize();
  focusPitchNode(0);
  initCanvasOnce();
  updatePitchPanel(0);

  startAutoPlay();
  for (const [idx] of Object.entries(slideTags)) {
    syncNodeTagsToDOM(parseInt(idx));
  }
}

function exitPitch() {
  if (quizMode) { exitQuiz(); return; }
  if (coverMode) { exitCoverMode(); return; }
  if (brainstormMode) { exitBrainstormMode(); return; }

  isInPitch = false;
  stopAutoPlay();
  exitQuizMode();
  exitCoverMode();
  exitBrainstormMode();
  document.getElementById('pitchPage').style.display = 'none';
}

function showPreview() {
  document.getElementById('uploadPage').style.display = 'none';
  document.getElementById('previewPage').style.display = 'flex';
}

function showUpload() {
  document.getElementById('previewPage').style.display = 'none';
  document.getElementById('uploadPage').style.display = 'flex';
  resetAllState();
  currentData = null;
  slides = [];
  totalNodes = 0;
  currentFocus = 0;
  fileInput.value = '';
}

// ======================================================================
//  AUTO-PLAY, COVER, BRAINSTORM, QUIZ & TAGS
// ======================================================================
function toggleAutoPlay() { isAutoPlaying ? stopAutoPlay() : startAutoPlay(); }
function startAutoPlay() {
  isAutoPlaying = true;
  document.getElementById('autoPlayDot').style.display = 'inline-block';
  document.getElementById('autoPlayLabel').textContent = '⏸ 暂停';
  updatePitchHint();
  scheduleNextSlide();
}
function stopAutoPlay() {
  isAutoPlaying = false;
  clearTimeout(autoPlayTimerId);
  autoPlayTimerId = null;
  document.getElementById('autoPlayDot').style.display = 'none';
  document.getElementById('autoPlayLabel').textContent = '▶ 播放';
  updatePitchHint();
}
function scheduleNextSlide() {
  if (!isAutoPlaying) return;
  const interval = BASE_INTERVAL / autoPlaySpeed;
  autoPlayTimerId = setTimeout(() => {
    const prevFocus = currentFocus;
    nextSlide();
    if (currentFocus === prevFocus && currentFocus >= totalNodes - 1) {
      stopAutoPlay();
      return;
    }
    scheduleNextSlide();
  }, interval);
}
function setAutoPlaySpeed(speed, btnEl) {
  autoPlaySpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  if (isAutoPlaying) { clearTimeout(autoPlayTimerId); scheduleNextSlide(); }
}

function toggleCoverMode() { coverMode ? exitCoverMode() : enterCoverMode(); }
function enterCoverMode() {
  coverMode = true;
  document.getElementById('btnCoverMode').textContent = '退出遮盖';
  document.getElementById('btnCoverMode').classList.add('btn-danger');
  document.getElementById('btnCoverMode').classList.remove('btn-secondary');
  document.getElementById('btnCoverAll').style.display = '';
  document.getElementById('btnUncoverAll').style.display = '';
  document.getElementById('coverModeIndicator').classList.add('active');
  updatePitchHint();
}
function exitCoverMode() {
  coverMode = false;
  document.getElementById('btnCoverMode').textContent = '遮盖模式';
  document.getElementById('btnCoverMode').classList.remove('btn-danger');
  document.getElementById('btnCoverMode').classList.add('btn-secondary');
  document.getElementById('btnCoverAll').style.display = 'none';
  document.getElementById('btnUncoverAll').style.display = 'none';
  document.getElementById('coverModeIndicator').classList.remove('active');
  updatePitchHint();
}
function coverAll() {
  const cards = document.querySelectorAll('#pspChildren .psp-child-card.coverable');
  cards.forEach(el => {
    el.classList.add('covered');
    const overlay = el.querySelector('.cover-overlay');
    if (overlay) overlay.classList.remove('hidden');
  });
  const noteArea = document.getElementById('pspNoteArea');
  if (noteArea && noteArea.style.display !== 'none') {
    noteArea.classList.add('covered');
    const noteOverlay = noteArea.querySelector('.cover-overlay');
    if (noteOverlay) noteOverlay.classList.remove('hidden');
  }
}
function uncoverAll() {
  const cards = document.querySelectorAll('#pspChildren .psp-child-card.coverable');
  cards.forEach(el => {
    el.classList.remove('covered');
    const overlay = el.querySelector('.cover-overlay');
    if (overlay) overlay.classList.add('hidden');
  });
  const noteArea = document.getElementById('pspNoteArea');
  if (noteArea) {
    noteArea.classList.remove('covered');
    const noteOverlay = noteArea.querySelector('.cover-overlay');
    if (noteOverlay) noteOverlay.classList.add('hidden');
  }
}
function toggleElementCover(el) {
  const overlay = el.querySelector('.cover-overlay');
  if (!overlay) return;
  const hidden = overlay.classList.contains('hidden');
  if (hidden) { overlay.classList.remove('hidden'); el.classList.add('covered'); }
  else { overlay.classList.add('hidden'); el.classList.remove('covered'); }
}

function toggleBrainstormMode() { brainstormMode ? exitBrainstormMode() : enterBrainstormMode(); }
function enterBrainstormMode() {
  brainstormMode = true;
  document.getElementById('drawCanvas').classList.add('active');
  document.getElementById('drawToolbar').classList.add('active');
  document.getElementById('btnBrainstorm').textContent = '🎨 退出涂鸦';
  document.getElementById('btnBrainstorm').classList.add('btn-danger');
  document.getElementById('btnBrainstorm').classList.remove('btn-secondary');
  resizeCanvas();
  updatePitchHint();
}
function exitBrainstormMode() {
  brainstormMode = false;
  isDrawing = false;
  clearCanvas();
  document.getElementById('drawCanvas').classList.remove('active');
  document.getElementById('drawToolbar').classList.remove('active');
  document.getElementById('btnBrainstorm').textContent = '🎨 涂鸦';
  document.getElementById('btnBrainstorm').classList.remove('btn-danger');
  document.getElementById('btnBrainstorm').classList.add('btn-secondary');
  updatePitchHint();
}
function initCanvasOnce() {
  if (drawCanvas) return;
  drawCanvas = document.getElementById('drawCanvas');
  drawCtx = drawCanvas.getContext('2d');
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  resizeCanvas();
  drawCanvas.addEventListener('mousedown', startDrawing);
  drawCanvas.addEventListener('mousemove', draw);
  drawCanvas.addEventListener('mouseup', stopDrawing);
  drawCanvas.addEventListener('mouseleave', stopDrawing);
  drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
  drawCanvas.addEventListener('touchmove', draw, { passive: false });
  drawCanvas.addEventListener('touchend', stopDrawing);
  drawCanvas.addEventListener('touchcancel', stopDrawing);
  window.addEventListener('resize', resizeCanvas);
}
function resizeCanvas() {
  if (!drawCanvas) return;
  const tmp = document.createElement('canvas');
  tmp.width = drawCanvas.width; tmp.height = drawCanvas.height;
  const tmpCtx = tmp.getContext('2d');
  tmpCtx.drawImage(drawCanvas, 0, 0);
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
  if (drawCtx && tmp.width > 0) drawCtx.drawImage(tmp, 0, 0);
  if (drawCtx) { drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; }
}
function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  if (e.touches && e.touches.length > 0)
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function startDrawing(e) {
  if (!brainstormMode) return;
  e.preventDefault();
  isDrawing = true;
  const pos = getPos(e);
  lastPos = pos;
  drawCtx.globalCompositeOperation = drawingState.tool === 'eraser' ? 'destination-out' : 'source-over';
  drawCtx.fillStyle = drawingState.tool === 'eraser' ? 'rgba(0,0,0,1)' : drawingState.color;
  drawCtx.beginPath();
  drawCtx.arc(pos.x, pos.y, drawingState.size / 2, 0, Math.PI * 2);
  drawCtx.fill();
}
function draw(e) {
  if (!isDrawing || !brainstormMode) return;
  e.preventDefault();
  const pos = getPos(e);
  drawCtx.globalCompositeOperation = drawingState.tool === 'eraser' ? 'destination-out' : 'source-over';
  drawCtx.strokeStyle = drawingState.color;
  drawCtx.lineWidth = drawingState.size;
  drawCtx.beginPath();
  drawCtx.moveTo(lastPos.x, lastPos.y);
  drawCtx.lineTo(pos.x, pos.y);
  drawCtx.stroke();
  lastPos = pos;
}
function stopDrawing() { isDrawing = false; }
function setDrawTool(tool) {
  drawingState.tool = tool;
  document.getElementById('drawToolPen').classList.toggle('active', tool === 'pen');
  document.getElementById('drawToolEraser').classList.toggle('active', tool === 'eraser');
}
function setDrawColor(color, btnEl) {
  drawingState.color = color;
  document.querySelectorAll('.draw-color-dot').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
}
function setDrawSize(size, btnEl) {
  drawingState.size = size;
  document.querySelectorAll('.draw-size-dot').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
}
function clearCanvas() {
  if (!drawCtx || !drawCanvas) return;
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
}

function toggleQuizMode() { quizMode ? exitQuiz() : startQuiz(); }
function startQuiz() {
  quizPool = []; quizReviewed = new Set(); quizAnswerRevealed = false;
  for (let i = 1; i < totalNodes; i++) {
    if (slides[i].children.length > 0) quizPool.push(i);
  }
  if (quizPool.length === 0) { alert('需要至少一个非根节点才能使用测验模式'); quizMode = false; return; }
  quizMode = true;
  unblackAll();
  document.getElementById('quizPanel').classList.add('active');
  document.getElementById('btnQuiz').textContent = '❌ 退出测验';
  document.getElementById('btnQuiz').classList.add('btn-danger');
  document.getElementById('btnQuiz').classList.remove('btn-secondary');
  updateQuizProgress();
  nextQuizSlide();
}
function nextQuizSlide() {
  quizAnswerRevealed = false;
  const remaining = quizPool.filter(i => !quizReviewed.has(i));
  if (remaining.length === 0) quizReviewed.clear();
  const pool = quizPool.filter(i => !quizReviewed.has(i));
  const randomIdx = pool[Math.floor(Math.random() * pool.length)];
  quizReviewed.add(randomIdx);
  focusPitchNode(randomIdx);
  setTimeout(() => coverAll(), 150);
  updateQuizProgress();
  updatePitchHint();
}
function revealQuizAnswer() {
  if (!quizMode) return;
  quizAnswerRevealed = true;
  uncoverAll();
}
function updateQuizProgress() {
  document.getElementById('quizProgress').innerHTML =
    `已复习 <strong>${quizReviewed.size}</strong> / <strong>${quizPool.length}</strong> 题`;
}
function exitQuiz() {
  quizMode = false; quizAnswerRevealed = false;
  uncoverAll();
  document.getElementById('quizPanel').classList.remove('active');
  document.getElementById('btnQuiz').textContent = '❓ 测验';
  document.getElementById('btnQuiz').classList.remove('btn-danger');
  document.getElementById('btnQuiz').classList.add('btn-secondary');
  updatePitchHint();
}
function exitQuizMode() {
  if (quizMode) {
    quizMode = false; quizAnswerRevealed = false; uncoverAll();
    document.getElementById('quizPanel').classList.remove('active');
    document.getElementById('btnQuiz').textContent = '❓ 测验';
    document.getElementById('btnQuiz').classList.remove('btn-danger');
    document.getElementById('btnQuiz').classList.add('btn-secondary');
  }
}

function handleTagInput(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    const input = document.getElementById('tagInput');
    const tag = input.value.trim();
    if (tag) { addTag(currentFocus, tag); input.value = ''; }
  }
  if (event.key.startsWith('Arrow') || event.key === ' ') event.stopPropagation();
}
function addTag(nodeIndex, tag) {
  if (!slideTags[nodeIndex]) slideTags[nodeIndex] = [];
  if (slideTags[nodeIndex].includes(tag)) return;
  slideTags[nodeIndex].push(tag);
  syncNodeTagsToDOM(nodeIndex);
  if (tagPanelOpen) renderTagPanel();
}
function removeTag(nodeIndex, tag) {
  if (!slideTags[nodeIndex]) return;
  slideTags[nodeIndex] = slideTags[nodeIndex].filter(t => t !== tag);
  if (slideTags[nodeIndex].length === 0) delete slideTags[nodeIndex];
  syncNodeTagsToDOM(nodeIndex);
  if (tagPanelOpen) renderTagPanel();
}
function syncNodeTagsToDOM(nodeIndex) {
  const cardWrapper = document.getElementById(`pt-node-${nodeIndex}`);
  if (!cardWrapper) return;
  const existing = cardWrapper.querySelector('.node-tags');
  if (existing) existing.remove();
  const tags = slideTags[nodeIndex];
  if (!tags || tags.length === 0) return;
  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'node-tags';
  tags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${escapeHtml(tag)} <span class="tag-remove">×</span>`;
    chip.querySelector('.tag-remove').addEventListener('click', (e) => {
      e.stopPropagation(); e.preventDefault();
      removeTag(nodeIndex, tag);
    });
    chip.addEventListener('click', (e) => {
      e.stopPropagation(); e.preventDefault();
      jumpToNodeByTag(nodeIndex);
    });
    tagsDiv.appendChild(chip);
  });
  cardWrapper.appendChild(tagsDiv);
}
function jumpToNodeByTag(nodeIndex) { focusPitchNode(nodeIndex); }
function openTagPanel() {
  tagPanelOpen = !tagPanelOpen;
  const panel = document.getElementById('tagPanel');
  if (tagPanelOpen) { panel.classList.add('open'); renderTagPanel(); }
  else panel.classList.remove('open');
}
function closeTagPanel() {
  tagPanelOpen = false;
  document.getElementById('tagPanel').classList.remove('open');
}
function renderTagPanel() {
  const content = document.getElementById('tagPanelContent');
  const entries = [];
  for (const [nodeIdx, tags] of Object.entries(slideTags)) {
    if (parseInt(nodeIdx) >= totalNodes) continue;
    const slide = slides[parseInt(nodeIdx)];
    if (!slide) continue;
    tags.forEach(tag => entries.push({ tag, nodeIndex: parseInt(nodeIdx), title: slide.title }));
  }
  if (entries.length === 0) {
    content.innerHTML = '<div class="tag-panel-empty">暂无标签<br><span style="font-size:11px">在输入框输入后回车添加</span></div>';
    return;
  }
  const grouped = {};
  entries.forEach(e => { if (!grouped[e.tag]) grouped[e.tag] = []; grouped[e.tag].push(e); });
  let html = '';
  for (const [tag, items] of Object.entries(grouped)) {
    html += `<div style="margin-bottom:10px;"><div style="color:#a5b4fc;font-weight:600;font-size:12px;margin-bottom:4px;">🏷 ${escapeHtml(tag)} (${items.length})</div>`;
    items.forEach(item => {
      html += `<div class="tag-panel-item" onclick="jumpToNodeByTag(${item.nodeIndex});closeTagPanel();">
        <span class="tag-panel-slide">${renderContent(item.title)}</span>
        <span style="color:#475569;font-size:10px;flex-shrink:0;margin-left:8px;">#${item.nodeIndex + 1}</span>
      </div>`;
    });
    html += '</div>';
  }
  content.innerHTML = html;
}

// ======================================================================
//  FEATURE: 查找定位
// ======================================================================
function onSearchInput() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const countEl = document.getElementById('searchCount');
  // Clear previous highlights
  document.querySelectorAll('.search-highlight').forEach(el => el.classList.remove('search-highlight'));

  if (!query) {
    searchMatches = [];
    searchMatchIdx = -1;
    countEl.style.display = 'none';
    return;
  }

  // Find all matching node indices (search title)
  searchMatches = [];
  for (let i = 0; i < slides.length; i++) {
    if (slides[i].title.toLowerCase().includes(query)) {
      searchMatches.push(i);
    }
  }
  searchMatchIdx = searchMatches.length > 0 ? 0 : -1;

  if (searchMatches.length > 0) {
    countEl.textContent = `${searchMatchIdx + 1}/${searchMatches.length}`;
    countEl.style.display = '';
    // Highlight all matches in tree
    searchMatches.forEach(idx => {
      const el = document.getElementById(`pt-node-${idx}`);
      if (el) el.classList.add('search-highlight');
    });
    // Jump to first match
    focusPitchNode(searchMatches[0]);
  } else {
    countEl.textContent = '0';
    countEl.style.display = '';
  }
}

function onSearchKeydown(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    if (searchMatches.length === 0) return;
    // Cycle to next match
    searchMatchIdx = (searchMatchIdx + 1) % searchMatches.length;
    focusPitchNode(searchMatches[searchMatchIdx]);
    document.getElementById('searchCount').textContent = `${searchMatchIdx + 1}/${searchMatches.length}`;
    // Re-highlight
    document.querySelectorAll('.search-highlight').forEach(el => el.classList.remove('search-highlight'));
    searchMatches.forEach(idx => {
      const el = document.getElementById(`pt-node-${idx}`);
      if (el) el.classList.add('search-highlight');
    });
  } else if (event.key === 'Escape') {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchInput').blur();
    onSearchInput(); // clear
    event.stopPropagation(); // don't also exit pitch
  }
  // Don't let arrow keys in search bubble to navigation
  if (event.key.startsWith('Arrow') || event.key === ' ') {
    event.stopPropagation();
  }
}

// ======================================================================
//  FEATURE: 面板拖拽调节宽度
// ======================================================================
let panelWidth = 440;
const PANEL_MIN = 240;
const PANEL_MAX = 800;

function initPanelResize() {
  const handle = document.getElementById('panelResizeHandle');
  if (!handle) return;
  let startX, startWidth;

  function onDown(e) {
    e.preventDefault();
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startWidth = panelWidth;
    handle.classList.add('active');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  function onMove(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const delta = startX - clientX;
    panelWidth = Math.min(PANEL_MAX, Math.max(PANEL_MIN, startWidth + delta));
    applyPanelWidth();
  }

  function onUp() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }

  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, { passive: false });
}

function applyPanelWidth() {
  const panel = document.getElementById('pitchSlidePanel');
  const viewport = document.getElementById('pitchViewport');
  if (panel) panel.style.width = panelWidth + 'px';
  if (viewport) viewport.style.right = panelWidth + 'px';
}

// ======================================================================
//  FEATURE: 缩放
// ======================================================================
function applyZoom() {
  const trees = [document.getElementById('mindmapTree'), document.getElementById('pitchTree')];
  trees.forEach(tree => {
    if (!tree) return;
    tree.style.transform = `scale(${zoomLevel})`;
    tree.style.transformOrigin = 'top left';
  });
  const labels = [document.getElementById('zoomLabel'), document.getElementById('zoomLabelPreview')];
  labels.forEach(l => { if (l) l.textContent = `${Math.round(zoomLevel * 100)}%`; });
}

function zoomIn() {
  zoomLevel = Math.min(ZOOM_MAX, zoomLevel + ZOOM_STEP);
  applyZoom();
}

function zoomOut() {
  zoomLevel = Math.max(ZOOM_MIN, zoomLevel - ZOOM_STEP);
  applyZoom();
}

function zoomReset() {
  zoomLevel = 1.0;
  applyZoom();
}

// ======================================================================
//  KEYBOARD & CLICK HANDLERS
// ======================================================================
document.addEventListener('keydown', (e) => {
  if (!isInPitch) return;

  if (document.activeElement === document.getElementById('tagInput')) {
    if (e.key === 'Escape') { document.getElementById('tagInput').blur(); e.preventDefault(); }
    return;
  }
  // Search input active: handled by onSearchKeydown
  if (document.activeElement === document.getElementById('searchInput')) return;
  if (e.key === 'Escape') { e.preventDefault(); exitPitch(); return; }
  if (quizMode || coverMode) return;

  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault(); if (isAutoPlaying) stopAutoPlay(); nextSlide();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault(); if (isAutoPlaying) stopAutoPlay(); focusNextSibling();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); if (isAutoPlaying) stopAutoPlay(); focusPrevSibling();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault(); if (isAutoPlaying) stopAutoPlay(); focusParent();
  }
});

document.getElementById('pitchTree').addEventListener('click', (e) => {
  if (!isInPitch) return;
  if (e.target.closest('.pitch-controls') || e.target.closest('.pitch-top-controls')) return;

  if (quizMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) {
      const overlay = coverableEl.querySelector('.cover-overlay');
      if (overlay && !overlay.classList.contains('hidden')) toggleElementCover(coverableEl);
    }
    return;
  }

  if (coverMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) toggleElementCover(coverableEl);
    return;
  }

  if (e.target.closest('.tag-chip') || e.target.closest('.tag-remove') || e.target.closest('.tag-panel')) return;
  if (brainstormMode && e.target.closest('#drawCanvas')) return;

  const cardWrapper = e.target.closest('.pt-card-wrapper');
  if (cardWrapper) {
    const nodeEl = cardWrapper.closest('.pt-node');
    if (nodeEl) {
      const idx = parseInt(nodeEl.getAttribute('data-node-index'));
      if (!isNaN(idx)) {
        if (isAutoPlaying) stopAutoPlay();
        focusPitchNode(idx);
      }
    }
    return;
  }
  nextSlide();
});

document.getElementById('pitchSlidePanel').addEventListener('click', (e) => {
  if (!isInPitch) return;
  if (quizMode || coverMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) toggleElementCover(coverableEl);
  }
});

document.addEventListener('click', (e) => {
  if (!tagPanelOpen) return;
  if (!e.target.closest('.tag-panel') && !e.target.closest('#tagInput')) closeTagPanel();
});
</script>
