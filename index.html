<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Young Rich</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ===== 全局基础 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0a0a1a; color: #fff; overflow: hidden; height: 100vh; width: 100vw;
}
#app { width: 100%; height: 100%; }

/* ===== 上传页 ===== */
#uploadPage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; padding: 40px;
}
.brand { text-align: center; margin-bottom: 40px; }
.brand h1 {
  font-size: 32px; font-weight: 800;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { font-size: 14px; color: #64748b; margin-top: 6px; }
.upload-box {
  border: 2px dashed #3a3a5c; border-radius: 20px; padding: 50px 60px;
  text-align: center; cursor: pointer; transition: all 0.3s;
  background: rgba(255,255,255,0.02); max-width: 480px; width: 100%;
}
.upload-box:hover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
.upload-box.dragover { border-color: #818cf8; background: rgba(99,102,241,0.1); }
.upload-icon { font-size: 40px; margin-bottom: 12px; }
.upload-title { font-size: 18px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; }
.upload-desc { font-size: 13px; color: #94a3b8; }
.upload-hint { margin-top: 20px; font-size: 12px; color: #475569; }
input[type="file"] { display: none; }
#loadingArea, #errorArea { margin-top: 24px; display: none; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.spinner {
  width: 36px; height: 36px; border: 3px solid rgba(99,102,241,0.2);
  border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  padding: 14px 20px; background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.2); border-radius: 10px;
  color: #fca5a5; font-size: 13px; max-width: 480px;
}

/* ===== 预览页 ===== */
#previewPage { display: none; flex-direction: column; height: 100%; }
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: rgba(15,15,35,0.95);
  border-bottom: 1px solid #1e1e3f; backdrop-filter: blur(10px); flex-shrink: 0;
}
.toolbar-left { display: flex; align-items: center; gap: 12px; }
.toolbar-title {
  font-size: 15px; font-weight: 600; color: #e2e8f0;
  max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.toolbar-info { font-size: 11px; color: #475569; margin-left: 4px; }
.btn {
  padding: 7px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 13px; font-weight: 500; transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
}
.btn-primary { background: #6366f1; color: white; }
.btn-primary:hover { background: #818cf8; }
.btn-secondary { background: rgba(255,255,255,0.08); color: #cbd5e1; }
.btn-secondary:hover { background: rgba(255,255,255,0.12); }
.btn-danger { background: rgba(239,68,68,0.15); color: #fca5a5; }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

.preview-body {
  flex: 1; overflow: auto; position: relative; background: #0f0f23; padding: 40px;
}
.mindmap-tree {
  display: flex; align-items: flex-start; justify-content: flex-start;
  min-width: fit-content; min-height: fit-content; padding: 20px 0;
}

/* ===== 预览右向层次树 ===== */
.tree-node { display: flex; align-items: center; position: relative; }
.node-card {
  padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500;
  color: #e2e8f0; white-space: nowrap; max-width: 280px;
  overflow: hidden; text-overflow: ellipsis; position: relative; z-index: 2;
  cursor: default; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
}
.node-card:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.node-card.level-0 {
  background: #6366f1; color: white; font-size: 20px; font-weight: 700;
  padding: 16px 28px; box-shadow: 0 4px 24px rgba(99,102,241,0.35); border-radius: 12px;
}
.node-card.level-1 {
  font-size: 15px; background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.2);
  box-shadow: 0 2px 12px rgba(168,85,247,0.08);
}
.node-card.level-2 {
  font-size: 13px; background: rgba(6,182,212,0.08); border: 1px solid rgba(6,182,212,0.12); color: #cbd5e1;
}
.node-card.level-3 {
  font-size: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: #94a3b8;
}
.child-count-badge {
  font-size: 10px; background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8);
  padding: 1px 7px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
}
.node-children {
  display: flex; flex-direction: column; gap: 14px; margin-left: 70px; position: relative;
}
.node-children::before {
  content: ''; position: absolute; left: -35px; top: 50%; width: 35px; height: 2px;
  transform: translateY(-50%); background: linear-gradient(90deg, #6366f1, #3a3a5c); border-radius: 1px;
}
.node-children .tree-node::before {
  content: ''; position: absolute; left: -35px; top: 50%; width: 35px; height: 2px;
  transform: translateY(-50%); background: #3a3a5c; border-radius: 1px;
}
.node-children .tree-node::after {
  content: ''; position: absolute; left: -35px; top: 0; bottom: 0; width: 2px; background: #3a3a5c;
}
.node-children .tree-node:first-child::after { top: 50%; }
.node-children .tree-node:last-child::after { bottom: 50%; }
.node-children .tree-node:only-child::after { display: none; }

.empty-state { text-align: center; color: #475569; padding: 60px 20px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #64748b; }

/* ===== 演示页 ===== */
#pitchPage {
  display: none; position: fixed; inset: 0; background: #0a0a1a; z-index: 9999; overflow: hidden;
}

/* 顶部控制栏 */
.pitch-top-controls {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 8px 16px;
  background: linear-gradient(to bottom, rgba(10,10,26,0.98), rgba(10,10,26,0.85) 80%, transparent);
  pointer-events: none;
}
.pitch-top-controls > * { pointer-events: auto; }
.control-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.08); margin: 0 4px; }
.control-group { display: flex; align-items: center; gap: 3px; }

/* 速度按钮 */
.speed-btn {
  padding: 3px 9px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04); color: #94a3b8; cursor: pointer;
  font-size: 10px; transition: all 0.2s; font-weight: 500;
}
.speed-btn.active, .speed-btn:hover { background: #6366f1; border-color: #6366f1; color: white; }
.speed-btn:hover:not(.active) { background: rgba(99,102,241,0.3); }
.auto-play-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #10b981;
  animation: pulse-dot 1.2s ease-in-out infinite; display: inline-block; margin-right: 3px;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.3; transform: scale(1.8); }
}

/* ===== 演示树视口（左侧，给面板留空间）===== */
.pitch-viewport {
  position: absolute; top: 48px; left: 0; right: 440px; bottom: 64px;
  overflow: auto; scroll-behavior: smooth;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.pitch-viewport::-webkit-scrollbar { width: 6px; height: 6px; }
.pitch-viewport::-webkit-scrollbar-track { background: transparent; }
.pitch-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.pitch-tree {
  display: flex; align-items: flex-start;
  min-width: fit-content; min-height: 100%;
  padding: 40px 40px;
}

/* ===== Pitch Slide Panel（右侧独立演示面板）===== */
.pitch-slide-panel {
  position: absolute; top: 48px; right: 0; bottom: 64px; width: 440px;
  background: rgba(12,12,30,0.97); border-left: 1px solid #1e1e3f;
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 60px 28px 40px;
  z-index: 20; overflow-y: auto;
  backdrop-filter: blur(10px);
}
.psp-breadcrumb {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 32px; font-size: 12px; color: #64748b; flex-wrap: wrap;
}
.psp-title {
  font-size: 32px; font-weight: 800; line-height: 1.3; margin-bottom: 24px;
  color: #f1f5f9; text-align: center; word-break: break-word;
  width: 100%;
}
.psp-title.root-title {
  font-size: 38px;
  background: linear-gradient(135deg, #e2e8f0, #94a3b8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.psp-subtitle { font-size: 14px; color: #64748b; margin-top: -16px; margin-bottom: 24px; }
.psp-children {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  width: 100%; margin-bottom: 20px;
}
.psp-child-card {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 12px 20px; font-size: 15px; color: #cbd5e1;
  backdrop-filter: blur(10px); transition: all 0.25s; word-break: break-word;
  max-width: 380px; cursor: default;
  position: relative;
}
.psp-child-card:hover {
  background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.25);
  transform: translateY(-2px);
}
.psp-child-card .cover-overlay { border-radius: 12px; }
.psp-note-area {
  width: 100%; margin-top: 20px; font-size: 14px; color: #94a3b8; line-height: 1.7;
  text-align: center; padding: 12px 20px;
  background: rgba(255,255,255,0.02); border-radius: 10px;
  position: relative;
}
.psp-note-area .cover-overlay { border-radius: 10px; }
.psp-empty-hint { color: #334155; font-size: 13px; margin-top: 24px; }

/* 树节点 */
.pt-node {
  display: flex; align-items: center; position: relative;
  transition: filter 0.3s;
}
.pt-card-wrapper {
  position: relative; flex-shrink: 0; cursor: pointer;
  transition: transform 0.25s ease;
}
.pt-card-wrapper:hover { transform: scale(1.03); }
.pt-card {
  padding: 12px 22px; border-radius: 12px; font-weight: 600; color: #e2e8f0;
  white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis;
  transition: all 0.3s ease; position: relative; z-index: 2;
}
.pt-card.lv-0 {
  font-size: 22px; padding: 18px 32px; background: #6366f1; color: white;
  box-shadow: 0 4px 28px rgba(99,102,241,0.4); border-radius: 14px;
}
.pt-card.lv-1 {
  font-size: 16px; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.25);
}
.pt-card.lv-2 {
  font-size: 14px; background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.15);
}
.pt-card.lv-3 {
  font-size: 13px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.12); color: #cbd5e1;
}
.pt-card.lv-4 {
  font-size: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #94a3b8;
}

/* 渐进展开：未揭示的节点隐藏 */
.pt-node.unrevealed { display: none !important; }

/* 有隐藏子节点的提示 */
.pt-hidden-hint {
  display: inline-block; font-size: 10px; color: #818cf8;
  background: rgba(99,102,241,0.2); padding: 1px 6px; border-radius: 8px;
  margin-left: 6px; font-weight: 500; cursor: default;
  animation: hintPulse 2s ease-in-out infinite;
}
@keyframes hintPulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* 焦点高亮 */
.pt-card-wrapper.focused { z-index: 10; }
.pt-card-wrapper.focused .pt-card {
  animation: focusGlow 1.5s ease-in-out infinite;
  z-index: 10;
}
@keyframes focusGlow {
  0%, 100% { box-shadow: 0 0 16px rgba(99,102,241,0.5), 0 0 40px rgba(99,102,241,0.2); }
  50% { box-shadow: 0 0 28px rgba(99,102,241,0.8), 0 0 60px rgba(99,102,241,0.4); }
}
.pt-card-wrapper.focused .pt-card.lv-0 {
  animation: focusGlowRoot 1.5s ease-in-out infinite;
}
@keyframes focusGlowRoot {
  0%, 100% { box-shadow: 0 4px 28px rgba(99,102,241,0.4), 0 0 50px rgba(99,102,241,0.3); }
  50% { box-shadow: 0 4px 40px rgba(99,102,241,0.8), 0 0 80px rgba(168,85,247,0.5); }
}

/* 节点备注 */
.pt-note {
  font-size: 11px; color: #64748b; font-weight: 400; margin-top: 4px;
  max-width: 280px; white-space: normal; line-height: 1.4;
}

/* 子节点计数 */
.pt-badge {
  display: inline-block; font-size: 10px; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
  padding: 1px 7px; border-radius: 10px; margin-left: 6px; font-weight: 500;
}

/* 树子节点列 */
.pt-children {
  display: flex; flex-direction: column; gap: 16px;
  margin-left: 50px; position: relative;
}
/* 父节点到子节点列的横线 */
.pt-children::before {
  content: ''; position: absolute; left: -25px; top: 50%;
  width: 25px; height: 2px; transform: translateY(-50%);
  background: rgba(255,255,255,0.12); border-radius: 1px;
}
/* 每个子节点的横线 */
.pt-children > .pt-node::before {
  content: ''; position: absolute; left: -25px; top: 50%;
  width: 25px; height: 2px; transform: translateY(-50%);
  background: rgba(255,255,255,0.12); border-radius: 1px;
}
/* 连接兄弟节点的竖线 */
.pt-children > .pt-node::after {
  content: ''; position: absolute; left: -25px; top: 0; bottom: 0;
  width: 2px; background: rgba(255,255,255,0.12);
}
.pt-children > .pt-node:first-child::after { top: 50%; }
.pt-children > .pt-node:last-child::after { bottom: 50%; }
.pt-children > .pt-node:only-child::after { display: none; }

/* ===== 遮盖系统 ===== */
.coverable { position: relative; }
.cover-overlay {
  position: absolute; inset: 0; backdrop-filter: blur(14px);
  background: rgba(15, 15, 35, 0.88); border-radius: inherit;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 5; transition: all 0.3s ease;
  opacity: 1; pointer-events: auto;
}
.cover-overlay.hidden { opacity: 0; pointer-events: none; }
.cover-overlay:hover { background: rgba(15, 15, 35, 0.7); }
.cover-icon { font-size: 22px; opacity: 0.5; transition: all 0.2s; user-select: none; }
.cover-overlay:hover .cover-icon { opacity: 0.8; transform: scale(1.1); }
.cover-mode-indicator {
  position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
  background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5; padding: 6px 18px; border-radius: 20px;
  font-size: 12px; font-weight: 600; z-index: 100; pointer-events: none;
  display: none; animation: fadeInDown 0.3s ease;
}
.cover-mode-indicator.active { display: block; }
@keyframes fadeInDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== 涂鸦 ===== */
#drawCanvas {
  position: fixed; inset: 0; z-index: 45; pointer-events: none; cursor: crosshair;
}
#drawCanvas.active { pointer-events: auto; }
.draw-toolbar {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 6px;
  padding: 8px 16px; background: rgba(15, 15, 35, 0.96);
  border: 1px solid #1e1e3f; border-radius: 14px;
  backdrop-filter: blur(12px); z-index: 55;
}
.draw-toolbar.active { display: flex; animation: fadeInUp 0.3s ease; }
.draw-tool-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent;
  background: rgba(255,255,255,0.06); color: #94a3b8; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: all 0.2s;
}
.draw-tool-btn:hover { background: rgba(255,255,255,0.12); color: white; }
.draw-tool-btn.active { background: rgba(99,102,241,0.2); border-color: #6366f1; color: white; }
.draw-color-dot {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all 0.2s;
}
.draw-color-dot:hover, .draw-color-dot.active { border-color: white; transform: scale(1.2); }
.draw-size-dot {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: #94a3b8; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; transition: all 0.2s;
}
.draw-size-dot:hover, .draw-size-dot.active { background: rgba(99,102,241,0.2); border-color: #6366f1; color: white; }
.draw-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.08); }

/* ===== 测验面板 ===== */
.quiz-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 20px 32px 28px;
  background: linear-gradient(to top, rgba(10,10,26,0.98), rgba(10,10,26,0.9) 60%, transparent);
  z-index: 70; display: none; flex-direction: column; align-items: center; gap: 14px;
}
.quiz-panel.active { display: flex; animation: quizSlideUp 0.4s ease; }
@keyframes quizSlideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.quiz-progress { font-size: 13px; color: #64748b; }
.quiz-progress strong { color: #818cf8; }
.quiz-hint-area {
  padding: 18px 40px; background: rgba(99,102,241,0.05);
  border: 1px dashed rgba(99,102,241,0.25); border-radius: 14px;
  color: #94a3b8; font-size: 15px; cursor: pointer; transition: all 0.3s; text-align: center;
}
.quiz-hint-area:hover { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.5); color: #cbd5e1; }

/* ===== 标签系统 ===== */
.tag-input {
  width: 110px; padding: 5px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);
  color: #e2e8f0; font-size: 12px; outline: none; transition: border 0.2s;
}
.tag-input:focus { border-color: #6366f1; width: 140px; }
.tag-input::placeholder { color: #475569; }
.tag-panel {
  position: fixed; top: 52px; right: 12px; width: 280px; max-height: 420px;
  overflow-y: auto; background: rgba(15, 15, 35, 0.97);
  border: 1px solid #1e1e3f; border-radius: 12px; padding: 14px;
  z-index: 80; display: none; backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.tag-panel.open { display: block; animation: fadeInDown 0.2s ease; }
.tag-panel-title { font-size: 12px; color: #64748b; margin-bottom: 10px; font-weight: 600; }
.tag-panel-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 13px;
}
.tag-panel-item:hover { background: rgba(255,255,255,0.06); }
.tag-panel-tag { color: #a5b4fc; font-weight: 500; }
.tag-panel-slide { color: #94a3b8; font-size: 12px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-panel-empty { color: #475569; font-size: 12px; text-align: center; padding: 24px 0; }

/* 节点标签芯片 */
.node-tags {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; justify-content: center;
}
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 10px;
  background: rgba(99,102,241,0.18); color: #a5b4fc;
  font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s;
}
.tag-chip:hover { background: rgba(99,102,241,0.3); transform: translateY(-1px); }
.tag-chip .tag-remove { font-size: 13px; opacity: 0.5; margin-left: 2px; cursor: pointer; line-height: 1; }
.tag-chip .tag-remove:hover { opacity: 1; color: #fca5a5; }

/* 跳转高亮 */
.pt-card.jump-highlight { animation: jumpPulse 0.7s ease 3; }
@keyframes jumpPulse {
  0%, 100% { box-shadow: 0 0 0 rgba(99,102,241,0); }
  50% { box-shadow: 0 0 30px rgba(99,102,241,0.8), 0 0 60px rgba(99,102,241,0.3); }
}

/* ===== 底部控制栏 ===== */
.pitch-controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 32px; display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(to top, rgba(10,10,26,0.95), transparent);
  z-index: 10; pointer-events: none;
}
.pitch-controls > * { pointer-events: auto; }
.pitch-progress {
  position: absolute; bottom: 0; left: 0; height: 3px;
  background: #6366f1; transition: width 0.3s;
}
.pitch-page { font-size: 12px; color: #475569; }
.pitch-hint { font-size: 11px; color: #334155; }
.pitch-nav { display: flex; gap: 10px; }
.nav-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
  color: #94a3b8; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: all 0.2s; font-size: 12px;
}
.nav-btn:hover { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.3); color: white; }
.nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .pitch-top-controls { gap: 2px; padding: 6px 10px; }
  .pitch-top-controls .btn { padding: 5px 10px; font-size: 11px; }
  .speed-btn { padding: 2px 7px; font-size: 9px; }
  .pt-card { padding: 8px 14px; max-width: 200px; }
  .pt-card.lv-0 { font-size: 17px; padding: 12px 22px; }
  .pt-card.lv-1 { font-size: 14px; }
  .pt-card.lv-2 { font-size: 12px; }
  .pitch-tree { padding: 30px 24px; }
  .pt-children { margin-left: 36px; gap: 12px; }
  .pt-children::before, .pt-children > .pt-node::before { left: -18px; width: 18px; }
  .pt-children > .pt-node::after { left: -18px; }
  .tag-panel { width: 240px; right: 4px; }
  /* 移动端：面板缩窄或隐藏 */
  .pitch-viewport { right: 0; }
  .pitch-slide-panel {
    width: 100%; right: 0; top: auto; bottom: 64px; height: 45%;
    border-left: none; border-top: 1px solid #1e1e3f;
  }
}
</style>
</head>
<body>

<div id="app">
  <!-- ===== 上传页 ===== -->
  <div id="uploadPage">
    <div class="brand">
      <h1>XMind Pitch Mode</h1>
      <p>网页版 · 一键将思维导图变成演示文稿</p>
    </div>
    <div class="upload-box" id="uploadBox">
      <div class="upload-icon">📂</div>
      <div class="upload-title">点击或拖拽上传 .xmind 文件</div>
      <div class="upload-desc">支持 XMind 8 / XMind 2020+ 格式</div>
      <div class="upload-hint">文件仅在本地浏览器处理，不上传服务器</div>
    </div>
    <input type="file" id="fileInput" accept=".xmind">
    <div id="loadingArea">
      <div class="loading">
        <div class="spinner"></div>
        <div style="color:#64748b;font-size:13px;">正在解析思维导图...</div>
      </div>
    </div>
    <div id="errorArea" class="error-box"></div>
  </div>

  <!-- ===== 预览页 ===== -->
  <div id="previewPage">
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-secondary" onclick="showUpload()">← 返回</button>
        <span class="toolbar-title" id="previewTitle">未命名导图</span>
        <span class="toolbar-info" id="previewInfo"></span>
      </div>
      <button class="btn btn-primary" onclick="startPitch()">▶ 开始演示</button>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="mindmap-tree" id="mindmapTree"></div>
    </div>
  </div>

  <!-- ===== 演示页 ===== -->
  <div id="pitchPage">
    <!-- 顶部控制栏 -->
    <div class="pitch-top-controls" id="pitchTopControls">
      <button class="btn btn-secondary btn-sm" onclick="exitPitch()">← 退出</button>
      <span class="control-divider"></span>
      <div class="control-group">
        <button class="btn btn-secondary btn-sm" id="btnAutoPlay" onclick="toggleAutoPlay()">
          <span class="auto-play-dot" id="autoPlayDot" style="display:none"></span>
          <span id="autoPlayLabel">▶ 播放</span>
        </button>
        <button class="speed-btn active" data-speed="1" onclick="setAutoPlaySpeed(1,this)">1x</button>
        <button class="speed-btn" data-speed="0.5" onclick="setAutoPlaySpeed(0.5,this)">0.5x</button>
        <button class="speed-btn" data-speed="1.5" onclick="setAutoPlaySpeed(1.5,this)">1.5x</button>
        <button class="speed-btn" data-speed="2" onclick="setAutoPlaySpeed(2,this)">2x</button>
        <button class="speed-btn" data-speed="3" onclick="setAutoPlaySpeed(3,this)">3x</button>
      </div>
      <span class="control-divider"></span>
      <div class="control-group">
        <button class="btn btn-secondary btn-sm" id="btnCoverMode" onclick="toggleCoverMode()">🔒 遮盖</button>
        <button class="btn btn-secondary btn-sm" id="btnCoverAll" onclick="coverAll()" style="display:none">遮住子节点</button>
        <button class="btn btn-secondary btn-sm" id="btnUncoverAll" onclick="uncoverAll()" style="display:none">揭开子节点</button>
      </div>
      <span class="control-divider"></span>
      <button class="btn btn-secondary btn-sm" id="btnBrainstorm" onclick="toggleBrainstormMode()">🎨 涂鸦</button>
      <span class="control-divider"></span>
      <button class="btn btn-secondary btn-sm" id="btnQuiz" onclick="toggleQuizMode()">❓ 测验</button>
      <span class="control-divider"></span>
      <div class="control-group">
        <input type="text" class="tag-input" id="tagInput" placeholder="标签..." onkeydown="handleTagInput(event)">
        <button class="btn btn-secondary btn-sm" onclick="openTagPanel()" title="标签列表">🏷</button>
      </div>
    </div>

    <!-- 遮盖模式提示 -->
    <div class="cover-mode-indicator" id="coverModeIndicator">遮盖模式 · 点击节点卡片切换遮盖 · ESC 退出</div>

    <!-- 思维导图树视口 -->
    <div class="pitch-viewport" id="pitchViewport">
      <div class="pitch-tree" id="pitchTree"></div>
    </div>

    <!-- 独立演示面板（右侧，不受渐进展开影响）-->
    <div class="pitch-slide-panel" id="pitchSlidePanel">
      <div class="psp-breadcrumb" id="pspBreadcrumb"></div>
      <div class="psp-title" id="pspTitle"></div>
      <div class="psp-subtitle" id="pspSubtitle" style="display:none"></div>
      <div class="psp-children" id="pspChildren"></div>
      <div class="psp-note-area coverable" id="pspNoteArea" style="display:none">
        <div class="psp-note-text" id="pspNoteText"></div>
        <div class="cover-overlay hidden"><span class="cover-icon">🔒</span></div>
      </div>
      <div class="psp-empty-hint" id="pspEmpty">子节点将在下方卡片中显示</div>
    </div>

    <!-- 涂鸦画布 -->
    <canvas id="drawCanvas"></canvas>

    <!-- 涂鸦工具栏 -->
    <div class="draw-toolbar" id="drawToolbar">
      <button class="draw-tool-btn active" id="drawToolPen" onclick="setDrawTool('pen')" title="画笔">✏️</button>
      <button class="draw-tool-btn" id="drawToolEraser" onclick="setDrawTool('eraser')" title="橡皮">🧹</button>
      <span class="draw-sep"></span>
      <button class="draw-color-dot active" style="background:#ff4444" data-color="#ff4444" onclick="setDrawColor('#ff4444',this)"></button>
      <button class="draw-color-dot" style="background:#44cc44" data-color="#44cc44" onclick="setDrawColor('#44cc44',this)"></button>
      <button class="draw-color-dot" style="background:#4488ff" data-color="#4488ff" onclick="setDrawColor('#4488ff',this)"></button>
      <button class="draw-color-dot" style="background:#ffdd44" data-color="#ffdd44" onclick="setDrawColor('#ffdd44',this)"></button>
      <button class="draw-color-dot" style="background:#ff44cc" data-color="#ff44cc" onclick="setDrawColor('#ff44cc',this)"></button>
      <button class="draw-color-dot" style="background:#ffffff" data-color="#ffffff" onclick="setDrawColor('#ffffff',this)"></button>
      <span class="draw-sep"></span>
      <button class="draw-size-dot active" data-size="3" onclick="setDrawSize(3,this)">S</button>
      <button class="draw-size-dot" data-size="6" onclick="setDrawSize(6,this)">M</button>
      <button class="draw-size-dot" data-size="10" onclick="setDrawSize(10,this)">L</button>
      <span class="draw-sep"></span>
      <button class="draw-tool-btn" onclick="clearCanvas()" title="清除画布">🗑</button>
    </div>

    <!-- 标签面板 -->
    <div class="tag-panel" id="tagPanel">
      <div class="tag-panel-title">🏷 标签列表</div>
      <div id="tagPanelContent"></div>
    </div>

    <!-- 测验面板 -->
    <div class="quiz-panel" id="quizPanel">
      <div class="quiz-progress" id="quizProgress">已复习 <strong>0</strong> / <strong>0</strong> 题</div>
      <div class="quiz-hint-area" id="quizHintArea" onclick="revealQuizAnswer()">
        💡 点击此处查看答案 · 或点击被遮住的节点
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" id="btnNextQuiz" onclick="nextQuizSlide()">下一题 →</button>
        <button class="btn btn-secondary btn-sm" onclick="exitQuiz()">退出测验</button>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="pitch-controls">
      <div class="pitch-progress" id="pitchProgress"></div>
      <div class="pitch-page" id="pitchPageNum">1 / 1</div>
      <div class="pitch-hint" id="pitchHint">← → 空格移动焦点 · ↑↓ 切换兄弟节点 · ESC 退出</div>
      <div class="pitch-nav">
        <button class="nav-btn" id="btnPrev" onclick="if(isAutoPlaying)stopAutoPlay();prevSlide()">◀</button>
        <button class="nav-btn" id="btnNext" onclick="if(isAutoPlaying)stopAutoPlay();nextSlide()">▶</button>
      </div>
    </div>
  </div>
</div>

<script>
// ======================================================================
//  STATE
// ======================================================================
let currentData = null;
let slides = [];               // DFS traversal order for navigation
let currentFocus = 0;          // currently focused node index
let totalNodes = 0;
let fileName = '';
let isInPitch = false;

// Feature: Replay
let isAutoPlaying = false;
let autoPlaySpeed = 1;
let autoPlayTimerId = null;
const BASE_INTERVAL = 3000;

// Feature: Cover
let coverMode = false;

// Progressive reveal
let revealedNodes = new Set();

// Feature: Brainstorm / Drawing
let brainstormMode = false;
let drawingState = { tool: 'pen', color: '#ff4444', size: 3 };
let isDrawing = false;
let drawCanvas = null;
let drawCtx = null;
let lastPos = { x: 0, y: 0 };

// Feature: Quiz
let quizMode = false;
let quizPool = [];
let quizReviewed = new Set();
let quizAnswerRevealed = false;

// Feature: Tags
let slideTags = {};
let tagPanelOpen = false;

// ======================================================================
//  FILE HANDLING
// ======================================================================
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');

uploadBox.addEventListener('click', () => fileInput.click());
uploadBox.addEventListener('dragover', (e) => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
uploadBox.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadBox.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });

async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.xmind')) {
    showError('请选择 .xmind 格式的文件');
    return;
  }
  fileName = file.name.replace(/\.xmind$/i, '');
  document.getElementById('loadingArea').style.display = 'flex';
  document.getElementById('errorArea').style.display = 'none';

  try {
    const data = await parseXMind(file);
    currentData = data;
    resetAllState();
    renderPreview(data);
    generateSlides(data);
    showPreview();
  } catch (err) {
    showError('解析失败：' + err.message);
    console.error(err);
  } finally {
    document.getElementById('loadingArea').style.display = 'none';
  }
}

function showError(msg) {
  const el = document.getElementById('errorArea');
  el.textContent = msg;
  el.style.display = 'block';
}

async function parseXMind(file) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip 库加载失败，请检查网络');
  const zip = await JSZip.loadAsync(file);
  let contentFile = zip.file('content.json');
  if (!contentFile) {
    const files = Object.keys(zip.files);
    const contentPath = files.find(f => f.endsWith('content.json'));
    if (contentPath) contentFile = zip.file(contentPath);
  }
  if (!contentFile) throw new Error('找不到 content.json，可能是不支持的格式');
  const content = await contentFile.async('string');
  const parsed = JSON.parse(content);
  return Array.isArray(parsed) ? parsed[0] : parsed;
}

function resetAllState() {
  stopAutoPlay();
  exitCoverMode();
  exitBrainstormMode();
  exitQuizMode();
  slideTags = {};
  tagPanelOpen = false;
  revealedNodes = new Set();
  document.getElementById('tagPanel').classList.remove('open');
  document.getElementById('tagPanelContent').innerHTML = '';
  document.getElementById('tagInput').value = '';
  if (drawCtx && drawCanvas) { drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); }
}

// ======================================================================
//  PREVIEW TREE (unchanged)
// ======================================================================
function buildTreeHTML(topic, depth = 0) {
  const title = (topic.title || '无标题').trim();
  const children = topic.children?.attached || [];
  const hasChildren = children.length > 0;

  let cls = 'tree-node';
  if (depth === 0) cls += ' node-root';
  else if (hasChildren) cls += ' node-branch';
  else cls += ' node-leaf';

  const cardCls = `level-${Math.min(depth, 3)}`;

  let html = `<div class="${cls}" data-level="${depth}">`;
  html += `<div class="node-card ${cardCls}" title="${escapeAttr(title)}">${escapeHtml(title)}`;
  if (hasChildren) html += `<span class="child-count-badge">${children.length}</span>`;
  html += '</div>';
  if (hasChildren) {
    html += '<div class="node-children">';
    children.forEach(child => { html += buildTreeHTML(child, depth + 1); });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderPreview(sheet) {
  const rootTopic = sheet.rootTopic;
  const rootTitle = (rootTopic.title || fileName || '未命名导图').trim();
  document.getElementById('previewTitle').textContent = rootTitle;
  let nodeCount = 0;
  function count(n) { nodeCount++; (n.children?.attached || []).forEach(count); }
  count(rootTopic);
  function maxDepth(n) {
    const ch = n.children?.attached || [];
    return ch.length === 0 ? 1 : 1 + Math.max(...ch.map(maxDepth));
  }
  document.getElementById('previewInfo').textContent = `· ${nodeCount} 个节点 · ${maxDepth(rootTopic)} 层`;
  document.getElementById('mindmapTree').innerHTML = buildTreeHTML(rootTopic);
}

// ======================================================================
//  PITCH TREE: Build
// ======================================================================
let pitchNodeIndex = 0;

function buildPitchTreeHTML(topic, depth = 0) {
  const idx = pitchNodeIndex++;
  const title = (topic.title || '无标题').trim();
  const children = topic.children?.attached || [];
  const hasChildren = children.length > 0;
  const note = (topic.notes?.plain?.content || '').trim();
  const lvCls = `lv-${Math.min(depth, 4)}`;

  let html = `<div class="pt-node" data-node-index="${idx}" data-depth="${depth}">`;

  // Card wrapper (coverable)
  html += `<div class="pt-card-wrapper coverable" id="pt-node-${idx}" data-node="${idx}" data-depth="${depth}">`;
  html += `<div class="pt-card ${lvCls}">`;
  html += escapeHtml(title);
  if (hasChildren) html += `<span class="pt-badge">${children.length}</span>`;
  html += '</div>';
  if (note) html += `<div class="pt-note">${escapeHtml(note)}</div>`;
  html += `<div class="cover-overlay hidden"><span class="cover-icon">🔒</span></div>`;
  html += '</div>';

  // Children column
  if (hasChildren) {
    html += '<div class="pt-children">';
    children.forEach(child => { html += buildPitchTreeHTML(child, depth + 1); });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderPitchTree(sheet) {
  pitchNodeIndex = 0;
  const rootTopic = sheet.rootTopic;
  const html = buildPitchTreeHTML(rootTopic);
  document.getElementById('pitchTree').innerHTML = html;
  totalNodes = pitchNodeIndex;
}

// ======================================================================
//  PITCH TREE: Focus Navigation
// ======================================================================
function focusPitchNode(index) {
  if (index < 0 || index >= totalNodes) return;
  if (!revealedNodes.has(index)) return; // can't focus unrevealed nodes

  // Remove old focus
  const prev = document.querySelector('.pt-card-wrapper.focused');
  if (prev) prev.classList.remove('focused');

  // Add new focus
  const el = document.getElementById(`pt-node-${index}`);
  if (!el) return;
  el.classList.add('focused');
  currentFocus = index;

  // Smooth scroll to node
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });

  // Update UI
  document.getElementById('pitchPageNum').textContent = `${index + 1} / ${totalNodes}`;
  document.getElementById('pitchProgress').style.width = `${((index + 1) / totalNodes) * 100}%`;
  document.getElementById('btnPrev').disabled = index === 0;
  document.getElementById('btnNext').disabled = index === totalNodes - 1;

  // Sync tags
  syncNodeTagsToDOM(index);
  // Update independent pitch panel
  updatePitchPanel(index);
  updatePitchHint();
}

// Reveal all children of a node and update visibility
function revealChildrenOfNode(nodeIndex) {
  revealedNodes.add(nodeIndex);
  const nodeEl = document.querySelector(`.pt-node[data-node-index="${nodeIndex}"]`);
  if (!nodeEl) return;
  const childrenContainer = nodeEl.querySelector(':scope > .pt-children');
  if (!childrenContainer) return;
  const childNodes = childrenContainer.querySelectorAll(':scope > .pt-node');
  childNodes.forEach(child => {
    const idx = parseInt(child.getAttribute('data-node-index'));
    if (!isNaN(idx)) revealedNodes.add(idx);
  });
  updateNodeVisibility();
}

// Show/hide nodes based on revealed set
function updateNodeVisibility() {
  document.querySelectorAll('#pitchTree .pt-node').forEach(node => {
    const idx = parseInt(node.getAttribute('data-node-index'));
    if (isNaN(idx)) return;
    if (revealedNodes.has(idx)) {
      node.classList.remove('unrevealed');
      // Remove hidden-hint if it exists
      const hint = node.querySelector('.pt-hidden-hint');
      if (hint) hint.remove();
      // Add hint if this node has hidden children
      const childrenContainer = node.querySelector(':scope > .pt-children');
      if (childrenContainer && childrenContainer.children.length > 0) {
        const anyHidden = [...childrenContainer.children].some(
          c => c.classList.contains('pt-node') && c.classList.contains('unrevealed')
        );
        const card = node.querySelector(':scope > .pt-card-wrapper > .pt-card');
        if (anyHidden && card) {
          const existingHint = card.querySelector('.pt-hidden-hint');
          if (!existingHint) {
            const hiddenCount = [...childrenContainer.children].filter(
              c => c.classList.contains('pt-node') && c.classList.contains('unrevealed')
            ).length;
            const hint = document.createElement('span');
            hint.className = 'pt-hidden-hint';
            hint.textContent = `+${hiddenCount}`;
            card.appendChild(hint);
          }
        }
      }
    } else {
      node.classList.add('unrevealed');
    }
  });
}

// Update the independent pitch panel on the right side
function updatePitchPanel(index) {
  if (index < 0 || index >= slides.length) return;
  const slide = slides[index];

  // Breadcrumb
  const breadEl = document.getElementById('pspBreadcrumb');
  if (slide.path.length > 0) {
    breadEl.innerHTML = slide.path.map(p => escapeHtml(p)).join(' <span style="color:#475569">/</span> ');
    breadEl.style.display = '';
  } else {
    breadEl.style.display = 'none';
  }

  // Title
  const titleEl = document.getElementById('pspTitle');
  titleEl.textContent = slide.title;
  titleEl.className = slide.isRoot ? 'psp-title root-title' : 'psp-title';

  // Subtitle (root only)
  const subEl = document.getElementById('pspSubtitle');
  if (slide.isRoot && slide.children.length > 0) {
    subEl.textContent = `${slide.children.length} 个分支主题`;
    subEl.style.display = '';
  } else {
    subEl.style.display = 'none';
  }

  // Children cards
  const childrenEl = document.getElementById('pspChildren');
  if (slide.children.length > 0) {
    let cardsHtml = '';
    slide.children.forEach((child, j) => {
      cardsHtml += `<div class="psp-child-card coverable" id="psp-child-${j}" data-psp-child="${j}">
        <div>${escapeHtml(child)}</div>
        <div class="cover-overlay hidden"><span class="cover-icon">🔒</span></div>
      </div>`;
    });
    childrenEl.innerHTML = cardsHtml;
    childrenEl.style.display = '';
    document.getElementById('pspEmpty').style.display = 'none';
  } else {
    childrenEl.innerHTML = '';
    childrenEl.style.display = 'none';
    document.getElementById('pspEmpty').style.display = slide.isRoot ? '' : 'none';
  }

  // Note
  const noteArea = document.getElementById('pspNoteArea');
  const noteText = document.getElementById('pspNoteText');
  if (slide.note) {
    noteText.textContent = slide.note;
    noteArea.style.display = '';
  } else {
    noteArea.style.display = 'none';
  }
}

function getFocusedEl() {
  return document.getElementById(`pt-node-${currentFocus}`);
}

function getFocusedNodeEl() {
  const cardEl = document.getElementById(`pt-node-${currentFocus}`);
  if (!cardEl) return null;
  return cardEl.closest('.pt-node');
}

function getNodeChildrenContainer(nodeEl) {
  if (!nodeEl) return null;
  return nodeEl.querySelector(':scope > .pt-children');
}

function nextSlide() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;

  // 1) If current node has hidden children → reveal them and go to first child
  const children = getNodeChildrenContainer(nodeEl);
  if (children && children.children.length > 0) {
    const anyHidden = [...children.children].some(
      c => c.classList.contains('pt-node') && c.classList.contains('unrevealed')
    );
    if (anyHidden) {
      revealChildrenOfNode(currentFocus);
      const firstChild = children.querySelector(':scope > .pt-node');
      if (firstChild) {
        const idx = parseInt(firstChild.getAttribute('data-node-index'));
        if (!isNaN(idx) && revealedNodes.has(idx)) { focusPitchNode(idx); return; }
      }
    }
    // 2) Children already revealed → go to first child
    const firstVisible = [...children.children].find(
      c => c.classList.contains('pt-node') && !c.classList.contains('unrevealed')
    );
    if (firstVisible) {
      const idx = parseInt(firstVisible.getAttribute('data-node-index'));
      if (!isNaN(idx)) { focusPitchNode(idx); return; }
    }
  }

  // 3) No children → go to next revealed sibling, or next revealed node in DFS
  // Try next sibling first
  const nextSib = findNextRevealedSibling(nodeEl);
  if (nextSib !== null) { focusPitchNode(nextSib); return; }

  // Go up to parent and try next sibling
  let current = nodeEl;
  while (current) {
    const parentChildren = current.parentElement;
    if (!parentChildren || !parentChildren.classList.contains('pt-children')) break;
    const parentNode = parentChildren.parentElement;
    if (!parentNode || !parentNode.classList.contains('pt-node')) break;
    const parentNext = findNextRevealedSibling(parentNode);
    if (parentNext !== null) { focusPitchNode(parentNext); return; }
    current = parentNode;
  }

  // Fallback: next revealed in DFS order
  for (let i = currentFocus + 1; i < totalNodes; i++) {
    if (revealedNodes.has(i)) { focusPitchNode(i); return; }
  }
}

function findNextRevealedSibling(nodeEl) {
  let next = nodeEl.nextElementSibling;
  while (next) {
    if (next.classList.contains('pt-node') && !next.classList.contains('unrevealed')) {
      return parseInt(next.getAttribute('data-node-index'));
    }
    next = next.nextElementSibling;
  }
  return null;
}

function prevSlide() {
  // Go to previous revealed node in DFS
  for (let i = currentFocus - 1; i >= 0; i--) {
    if (revealedNodes.has(i)) { focusPitchNode(i); return; }
  }
}

// Sibling navigation (up/down) — only among revealed siblings
function focusNextSibling() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  const next = nodeEl.nextElementSibling;
  if (next && next.classList.contains('pt-node') && !next.classList.contains('unrevealed')) {
    const idx = parseInt(next.getAttribute('data-node-index'));
    if (!isNaN(idx)) { focusPitchNode(idx); }
  }
}
function focusPrevSibling() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  const prev = nodeEl.previousElementSibling;
  if (prev && prev.classList.contains('pt-node') && !prev.classList.contains('unrevealed')) {
    const idx = parseInt(prev.getAttribute('data-node-index'));
    if (!isNaN(idx)) { focusPitchNode(idx); }
  }
}

// Focus parent (left arrow)
function focusParent() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  const parentChildren = nodeEl.parentElement;
  if (!parentChildren || !parentChildren.classList.contains('pt-children')) return;
  const parentNode = parentChildren.parentElement;
  if (!parentNode || !parentNode.classList.contains('pt-node')) return;
  const idx = parseInt(parentNode.getAttribute('data-node-index'));
  if (!isNaN(idx)) { focusPitchNode(idx); }
}

// Focus first child (right arrow) — reveal first
function focusFirstChild() {
  const nodeEl = getFocusedNodeEl();
  if (!nodeEl) return;
  // Reveal children first if hidden
  const children = getNodeChildrenContainer(nodeEl);
  if (children && children.children.length > 0) {
    const anyHidden = [...children.children].some(
      c => c.classList.contains('pt-node') && c.classList.contains('unrevealed')
    );
    if (anyHidden) revealChildrenOfNode(currentFocus);
  }
  // Focus first visible child
  if (children) {
    const firstVisible = [...children.children].find(
      c => c.classList.contains('pt-node') && !c.classList.contains('unrevealed')
    );
    if (firstVisible) {
      const idx = parseInt(firstVisible.getAttribute('data-node-index'));
      if (!isNaN(idx)) { focusPitchNode(idx); }
    }
  }
}

function updatePitchHint() {
  const hint = document.getElementById('pitchHint');
  if (quizMode) hint.textContent = '测验模式 · ESC 退出';
  else if (coverMode) hint.textContent = '遮盖模式 · 点击节点切换遮盖 · ESC 退出';
  else if (brainstormMode) hint.textContent = '涂鸦模式 · ESC 退出涂鸦';
  else if (isAutoPlaying) hint.textContent = '自动播放中 · 手动操作暂停';
  else hint.textContent = '空格/→ 展开下一步 · ↑↓ 兄弟节点 · ← 回父节点 · 点击节点展开 · ESC 退出';
}

// ======================================================================
//  HELPERS
// ======================================================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function escapeAttr(text) {
  return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ======================================================================
//  SLIDES ARRAY (DFS navigation order only)
// ======================================================================
function generateSlides(sheet) {
  slides = [];
  function traverse(node, path = []) {
    const title = (node.title || '无标题').trim();
    const children = node.children?.attached || [];
    const note = node.notes?.plain?.content || '';
    slides.push({
      title,
      path: path.map(p => (p.title || '无标题').trim()),
      level: path.length,
      isRoot: path.length === 0,
      children: children.map(c => (c.title || '无标题').trim()).filter(t => t),
      note: note.trim()
    });
    children.forEach(child => traverse(child, [...path, node]));
  }
  traverse(sheet.rootTopic);
}

// ======================================================================
//  PAGE SWITCHING
// ======================================================================
function startPitch() {
  isInPitch = true;
  renderPitchTree(currentData);
  // Progressive reveal: start with only root visible
  revealedNodes = new Set([0]);
  updateNodeVisibility();
  document.getElementById('pitchPage').style.display = 'block';
  focusPitchNode(0);
  initCanvasOnce();
  updatePitchPanel(0);
  // Auto-play starts by default
  startAutoPlay();
  // Re-sync all tags into the DOM tree
  for (const [idx] of Object.entries(slideTags)) {
    syncNodeTagsToDOM(parseInt(idx));
  }
}

function exitPitch() {
  // ESC priority: quiz > cover > brainstorm > exit pitch
  if (quizMode) { exitQuiz(); return; }
  if (coverMode) { exitCoverMode(); return; }
  if (brainstormMode) { exitBrainstormMode(); return; }

  isInPitch = false;
  stopAutoPlay();
  exitQuizMode();
  exitCoverMode();
  exitBrainstormMode();
  document.getElementById('pitchPage').style.display = 'none';
}

function showPreview() {
  document.getElementById('uploadPage').style.display = 'none';
  document.getElementById('previewPage').style.display = 'flex';
}

function showUpload() {
  document.getElementById('previewPage').style.display = 'none';
  document.getElementById('uploadPage').style.display = 'flex';
  resetAllState();
  currentData = null;
  slides = [];
  totalNodes = 0;
  currentFocus = 0;
  fileInput.value = '';
}

// ======================================================================
//  FEATURE: REPLAY / AUTO-PLAY
// ======================================================================
function toggleAutoPlay() { isAutoPlaying ? stopAutoPlay() : startAutoPlay(); }

function startAutoPlay() {
  isAutoPlaying = true;
  document.getElementById('autoPlayDot').style.display = 'inline-block';
  document.getElementById('autoPlayLabel').textContent = '⏸ 暂停';
  updatePitchHint();
  scheduleNextSlide();
}

function stopAutoPlay() {
  isAutoPlaying = false;
  clearTimeout(autoPlayTimerId);
  autoPlayTimerId = null;
  document.getElementById('autoPlayDot').style.display = 'none';
  document.getElementById('autoPlayLabel').textContent = '▶ 播放';
  updatePitchHint();
}

function scheduleNextSlide() {
  if (!isAutoPlaying) return;
  const interval = BASE_INTERVAL / autoPlaySpeed;
  autoPlayTimerId = setTimeout(() => {
    const prevFocus = currentFocus;
    // Try: expand into children (if hidden) and advance
    nextSlide();
    if (currentFocus === prevFocus) {
      // No advance possible — are we at the true end?
      // Check if there are ANY hidden children left in the entire tree
      const anyHidden = document.querySelector('#pitchTree .pt-node.unrevealed');
      if (!anyHidden && currentFocus >= totalNodes - 1) {
        stopAutoPlay(); // Truly done: all nodes revealed and visited
        return;
      }
    }
    scheduleNextSlide();
  }, interval);
}

function setAutoPlaySpeed(speed, btnEl) {
  autoPlaySpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  if (isAutoPlaying) { clearTimeout(autoPlayTimerId); scheduleNextSlide(); }
}

function toggleCoverMode() { coverMode ? exitCoverMode() : enterCoverMode(); }

function enterCoverMode() {
  coverMode = true;
  document.getElementById('btnCoverMode').textContent = '🔓 退出遮盖';
  document.getElementById('btnCoverMode').classList.add('btn-danger');
  document.getElementById('btnCoverMode').classList.remove('btn-secondary');
  document.getElementById('btnCoverAll').style.display = '';
  document.getElementById('btnUncoverAll').style.display = '';
  document.getElementById('coverModeIndicator').classList.add('active');
  updatePitchHint();
}

function exitCoverMode() {
  coverMode = false;
  document.getElementById('btnCoverMode').textContent = '🔒 遮盖';
  document.getElementById('btnCoverMode').classList.remove('btn-danger');
  document.getElementById('btnCoverMode').classList.add('btn-secondary');
  document.getElementById('btnCoverAll').style.display = 'none';
  document.getElementById('btnUncoverAll').style.display = 'none';
  document.getElementById('coverModeIndicator').classList.remove('active');

}

// Cover all children in the independent pitch panel
function coverAll() {
  const cards = document.querySelectorAll('#pspChildren .psp-child-card.coverable');
  cards.forEach(el => {
    el.classList.add('covered');
    const overlay = el.querySelector('.cover-overlay');
    if (overlay) overlay.classList.remove('hidden');
  });
  // Also cover note
  const noteArea = document.getElementById('pspNoteArea');
  if (noteArea && noteArea.style.display !== 'none') {
    noteArea.classList.add('covered');
    const noteOverlay = noteArea.querySelector('.cover-overlay');
    if (noteOverlay) noteOverlay.classList.remove('hidden');
  }
}

// Uncover all children in the independent pitch panel
function uncoverAll() {
  const cards = document.querySelectorAll('#pspChildren .psp-child-card.coverable');
  cards.forEach(el => {
    el.classList.remove('covered');
    const overlay = el.querySelector('.cover-overlay');
    if (overlay) overlay.classList.add('hidden');
  });
  const noteArea = document.getElementById('pspNoteArea');
  if (noteArea) {
    noteArea.classList.remove('covered');
    const noteOverlay = noteArea.querySelector('.cover-overlay');
    if (noteOverlay) noteOverlay.classList.add('hidden');
  }
}

function toggleElementCover(el) {
  const overlay = el.querySelector('.cover-overlay');
  if (!overlay) return;
  const hidden = overlay.classList.contains('hidden');
  if (hidden) { overlay.classList.remove('hidden'); el.classList.add('covered'); }
  else { overlay.classList.add('hidden'); el.classList.remove('covered'); }
}

// ======================================================================
//  FEATURE: BRAINSTORM / DRAWING (unchanged core logic)
// ======================================================================
function toggleBrainstormMode() { brainstormMode ? exitBrainstormMode() : enterBrainstormMode(); }

function enterBrainstormMode() {
  brainstormMode = true;
  document.getElementById('drawCanvas').classList.add('active');
  document.getElementById('drawToolbar').classList.add('active');
  document.getElementById('btnBrainstorm').textContent = '🎨 退出涂鸦';
  document.getElementById('btnBrainstorm').classList.add('btn-danger');
  document.getElementById('btnBrainstorm').classList.remove('btn-secondary');
  resizeCanvas();
  updatePitchHint();
}

function exitBrainstormMode() {
  brainstormMode = false;
  isDrawing = false;
  clearCanvas();
  document.getElementById('drawCanvas').classList.remove('active');
  document.getElementById('drawToolbar').classList.remove('active');
  document.getElementById('btnBrainstorm').textContent = '🎨 涂鸦';
  document.getElementById('btnBrainstorm').classList.remove('btn-danger');
  document.getElementById('btnBrainstorm').classList.add('btn-secondary');
  updatePitchHint();
}

function initCanvasOnce() {
  if (drawCanvas) return;
  drawCanvas = document.getElementById('drawCanvas');
  drawCtx = drawCanvas.getContext('2d');
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  resizeCanvas();
  drawCanvas.addEventListener('mousedown', startDrawing);
  drawCanvas.addEventListener('mousemove', draw);
  drawCanvas.addEventListener('mouseup', stopDrawing);
  drawCanvas.addEventListener('mouseleave', stopDrawing);
  drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
  drawCanvas.addEventListener('touchmove', draw, { passive: false });
  drawCanvas.addEventListener('touchend', stopDrawing);
  drawCanvas.addEventListener('touchcancel', stopDrawing);
  window.addEventListener('resize', resizeCanvas);
}

function resizeCanvas() {
  if (!drawCanvas) return;
  const tmp = document.createElement('canvas');
  tmp.width = drawCanvas.width; tmp.height = drawCanvas.height;
  const tmpCtx = tmp.getContext('2d');
  tmpCtx.drawImage(drawCanvas, 0, 0);
  drawCanvas.width = window.innerWidth;
  drawCanvas.height = window.innerHeight;
  if (drawCtx && tmp.width > 0) drawCtx.drawImage(tmp, 0, 0);
  if (drawCtx) { drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; }
}

function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  if (e.touches && e.touches.length > 0)
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function startDrawing(e) {
  if (!brainstormMode) return;
  e.preventDefault();
  isDrawing = true;
  const pos = getPos(e);
  lastPos = pos;
  drawCtx.globalCompositeOperation = drawingState.tool === 'eraser' ? 'destination-out' : 'source-over';
  drawCtx.fillStyle = drawingState.tool === 'eraser' ? 'rgba(0,0,0,1)' : drawingState.color;
  drawCtx.beginPath();
  drawCtx.arc(pos.x, pos.y, drawingState.size / 2, 0, Math.PI * 2);
  drawCtx.fill();
}

function draw(e) {
  if (!isDrawing || !brainstormMode) return;
  e.preventDefault();
  const pos = getPos(e);
  drawCtx.globalCompositeOperation = drawingState.tool === 'eraser' ? 'destination-out' : 'source-over';
  drawCtx.strokeStyle = drawingState.color;
  drawCtx.lineWidth = drawingState.size;
  drawCtx.beginPath();
  drawCtx.moveTo(lastPos.x, lastPos.y);
  drawCtx.lineTo(pos.x, pos.y);
  drawCtx.stroke();
  lastPos = pos;
}

function stopDrawing() { isDrawing = false; }
function setDrawTool(tool) {
  drawingState.tool = tool;
  document.getElementById('drawToolPen').classList.toggle('active', tool === 'pen');
  document.getElementById('drawToolEraser').classList.toggle('active', tool === 'eraser');
}
function setDrawColor(color, btnEl) {
  drawingState.color = color;
  document.querySelectorAll('.draw-color-dot').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
}
function setDrawSize(size, btnEl) {
  drawingState.size = size;
  document.querySelectorAll('.draw-size-dot').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
}
function clearCanvas() {
  if (!drawCtx || !drawCanvas) return;
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
}

// ======================================================================
//  FEATURE: QUIZ MODE
// ======================================================================
function toggleQuizMode() { quizMode ? exitQuiz() : startQuiz(); }

function startQuiz() {
  quizPool = []; quizReviewed = new Set(); quizAnswerRevealed = false;
  // Only include non-leaf nodes (nodes with children to cover/reveal)
  for (let i = 1; i < totalNodes; i++) {
    if (slides[i].children.length > 0) quizPool.push(i);
  }
  if (quizPool.length === 0) { alert('需要至少一个非根节点才能使用测验模式'); quizMode = false; return; }
  quizMode = true;
  // Bypass progressive reveal: reveal all nodes for quiz
  for (let i = 0; i < totalNodes; i++) revealedNodes.add(i);
  updateNodeVisibility();
  document.getElementById('quizPanel').classList.add('active');
  document.getElementById('btnQuiz').textContent = '❌ 退出测验';
  document.getElementById('btnQuiz').classList.add('btn-danger');
  document.getElementById('btnQuiz').classList.remove('btn-secondary');
  updateQuizProgress();
  nextQuizSlide();
}

function nextQuizSlide() {
  quizAnswerRevealed = false;
  const remaining = quizPool.filter(i => !quizReviewed.has(i));
  if (remaining.length === 0) quizReviewed.clear();
  const pool = quizPool.filter(i => !quizReviewed.has(i));
  const randomIdx = pool[Math.floor(Math.random() * pool.length)];
  quizReviewed.add(randomIdx);
  focusPitchNode(randomIdx);
  setTimeout(() => coverAll(), 150);
  updateQuizProgress();
  updatePitchHint();
}

function revealQuizAnswer() {
  if (!quizMode) return;
  quizAnswerRevealed = true;
  uncoverAll();
}

function updateQuizProgress() {
  document.getElementById('quizProgress').innerHTML =
    `已复习 <strong>${quizReviewed.size}</strong> / <strong>${quizPool.length}</strong> 题`;
}

function exitQuiz() {
  quizMode = false; quizAnswerRevealed = false;
  uncoverAll();
  document.getElementById('quizPanel').classList.remove('active');
  document.getElementById('btnQuiz').textContent = '❓ 测验';
  document.getElementById('btnQuiz').classList.remove('btn-danger');
  document.getElementById('btnQuiz').classList.add('btn-secondary');
  updatePitchHint();
}

function exitQuizMode() {
  if (quizMode) {
    quizMode = false; quizAnswerRevealed = false; uncoverAll();
    document.getElementById('quizPanel').classList.remove('active');
    document.getElementById('btnQuiz').textContent = '❓ 测验';
    document.getElementById('btnQuiz').classList.remove('btn-danger');
    document.getElementById('btnQuiz').classList.add('btn-secondary');
  }
}

// ======================================================================
//  FEATURE: TAGS
// ======================================================================
function handleTagInput(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    const input = document.getElementById('tagInput');
    const tag = input.value.trim();
    if (tag) { addTag(currentFocus, tag); input.value = ''; }
  }
  if (event.key.startsWith('Arrow') || event.key === ' ') event.stopPropagation();
}

function addTag(nodeIndex, tag) {
  if (!slideTags[nodeIndex]) slideTags[nodeIndex] = [];
  if (slideTags[nodeIndex].includes(tag)) return;
  slideTags[nodeIndex].push(tag);
  syncNodeTagsToDOM(nodeIndex);
  if (tagPanelOpen) renderTagPanel();
}

function removeTag(nodeIndex, tag) {
  if (!slideTags[nodeIndex]) return;
  slideTags[nodeIndex] = slideTags[nodeIndex].filter(t => t !== tag);
  if (slideTags[nodeIndex].length === 0) delete slideTags[nodeIndex];
  syncNodeTagsToDOM(nodeIndex);
  if (tagPanelOpen) renderTagPanel();
}

function syncNodeTagsToDOM(nodeIndex) {
  const cardWrapper = document.getElementById(`pt-node-${nodeIndex}`);
  if (!cardWrapper) return;

  // Remove existing tags
  const existing = cardWrapper.querySelector('.node-tags');
  if (existing) existing.remove();

  const tags = slideTags[nodeIndex];
  if (!tags || tags.length === 0) return;

  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'node-tags';
  tags.forEach(tag => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${escapeHtml(tag)} <span class="tag-remove">×</span>`;
    chip.querySelector('.tag-remove').addEventListener('click', (e) => {
      e.stopPropagation(); e.preventDefault();
      removeTag(nodeIndex, tag);
    });
    chip.addEventListener('click', (e) => {
      e.stopPropagation(); e.preventDefault();
      jumpToNodeByTag(nodeIndex);
    });
    tagsDiv.appendChild(chip);
  });
  cardWrapper.appendChild(tagsDiv);
}

function jumpToNodeByTag(nodeIndex) {
  focusPitchNode(nodeIndex);
  const cardWrapper = document.getElementById(`pt-node-${nodeIndex}`);
  if (cardWrapper) {
    const card = cardWrapper.querySelector('.pt-card');
    if (card) { card.classList.add('jump-highlight'); setTimeout(() => card.classList.remove('jump-highlight'), 2100); }
  }
}

function openTagPanel() {
  tagPanelOpen = !tagPanelOpen;
  const panel = document.getElementById('tagPanel');
  if (tagPanelOpen) { panel.classList.add('open'); renderTagPanel(); }
  else panel.classList.remove('open');
}

function closeTagPanel() {
  tagPanelOpen = false;
  document.getElementById('tagPanel').classList.remove('open');
}

function renderTagPanel() {
  const content = document.getElementById('tagPanelContent');
  const entries = [];
  for (const [nodeIdx, tags] of Object.entries(slideTags)) {
    if (parseInt(nodeIdx) >= totalNodes) continue;
    const slide = slides[parseInt(nodeIdx)];
    if (!slide) continue;
    tags.forEach(tag => entries.push({ tag, nodeIndex: parseInt(nodeIdx), title: slide.title }));
  }
  if (entries.length === 0) {
    content.innerHTML = '<div class="tag-panel-empty">暂无标签<br><span style="font-size:11px">在上方输入标签名后按回车添加</span></div>';
    return;
  }
  const grouped = {};
  entries.forEach(e => { if (!grouped[e.tag]) grouped[e.tag] = []; grouped[e.tag].push(e); });
  let html = '';
  for (const [tag, items] of Object.entries(grouped)) {
    html += `<div style="margin-bottom:10px;"><div style="color:#a5b4fc;font-weight:600;font-size:12px;margin-bottom:4px;">🏷 ${escapeHtml(tag)} (${items.length})</div>`;
    items.forEach(item => {
      html += `<div class="tag-panel-item" onclick="jumpToNodeByTag(${item.nodeIndex});closeTagPanel();">
        <span class="tag-panel-slide" title="${escapeAttr(item.title)}">${escapeHtml(item.title)}</span>
        <span style="color:#475569;font-size:10px;flex-shrink:0;margin-left:8px;">#${item.nodeIndex + 1}</span>
      </div>`;
    });
    html += '</div>';
  }
  content.innerHTML = html;
}

// ======================================================================
//  KEYBOARD HANDLER
// ======================================================================
document.addEventListener('keydown', (e) => {
  if (!isInPitch) return;

  // Tag input active: block navigation keys
  if (document.activeElement === document.getElementById('tagInput')) {
    if (e.key === 'Escape') { document.getElementById('tagInput').blur(); e.preventDefault(); }
    return;
  }

  // ESC priority
  if (e.key === 'Escape') { e.preventDefault(); exitPitch(); return; }

  // Quiz mode: no navigation
  if (quizMode) return;

  // Cover mode: no slide navigation
  if (coverMode) return;

  // Tree navigation (manual → stop auto-play)
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (isAutoPlaying) stopAutoPlay();
    focusFirstChild();
  } else if (e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    if (isAutoPlaying) stopAutoPlay();
    nextSlide();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (isAutoPlaying) stopAutoPlay();
    focusNextSibling();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (isAutoPlaying) stopAutoPlay();
    focusPrevSibling();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    if (isAutoPlaying) stopAutoPlay();
    focusParent();
  }
});

// ======================================================================
//  CLICK HANDLER (tree interaction)
// ======================================================================
document.getElementById('pitchTree').addEventListener('click', (e) => {
  if (!isInPitch) return;
  if (e.target.closest('.pitch-controls') || e.target.closest('.pitch-top-controls')) return;

  // Quiz mode: clicking covered nodes reveals them
  if (quizMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) {
      const overlay = coverableEl.querySelector('.cover-overlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        toggleElementCover(coverableEl);
        // Check if all covered children are revealed
        const nodeEl = getFocusedNodeEl();
        if (nodeEl) {
          const children = getNodeChildrenContainer(nodeEl);
          if (children) {
            const allOverlays = children.querySelectorAll(':scope > .pt-node > .pt-card-wrapper .cover-overlay');
            const allHidden = [...allOverlays].every(o => o.classList.contains('hidden'));
            if (allHidden) quizAnswerRevealed = true;
          }
        }
      }
    }
    return;
  }

  // Cover mode: toggle cover on clicked node
  if (coverMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) { toggleElementCover(coverableEl); }
    return;
  }

  // Normal mode: click on a node card to focus it
  if (e.target.closest('.tag-chip') || e.target.closest('.tag-remove') ||
      e.target.closest('.tag-panel') || e.target.closest('.cover-overlay')) return;

  if (brainstormMode && e.target.closest('#drawCanvas')) return;

  const cardWrapper = e.target.closest('.pt-card-wrapper');
  if (cardWrapper) {
    const nodeEl = cardWrapper.closest('.pt-node');
    if (nodeEl) {
      const idx = parseInt(nodeEl.getAttribute('data-node-index'));
      if (!isNaN(idx) && revealedNodes.has(idx)) {
        if (isAutoPlaying) stopAutoPlay();
        // Click: reveal children of this node (if hidden), then focus
        const children = getNodeChildrenContainer(nodeEl);
        if (children && children.children.length > 0) {
          const anyHidden = [...children.children].some(
            c => c.classList.contains('pt-node') && c.classList.contains('unrevealed')
          );
          if (anyHidden) revealChildrenOfNode(idx);
        }
        focusPitchNode(idx);
      }
    }
    return;
  }

  // Click on empty space → next node
  nextSlide();
});

// ======================================================================
//  PITCH PANEL CLICK HANDLER (cover + quiz in independent panel)
// ======================================================================
document.getElementById('pitchSlidePanel').addEventListener('click', (e) => {
  if (!isInPitch) return;

  // Quiz mode: clicking covered elements in the panel reveals them
  if (quizMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) {
      const overlay = coverableEl.querySelector('.cover-overlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        toggleElementCover(coverableEl);
        // Check if all covered are now revealed
        const allOverlays = document.querySelectorAll('#pspChildren .cover-overlay, #pspNoteArea .cover-overlay');
        const allHidden = [...allOverlays].every(o => o.classList.contains('hidden'));
        if (allHidden) quizAnswerRevealed = true;
      }
    }
    return;
  }

  // Cover mode: toggle cover on clicked panel cards
  if (coverMode) {
    const coverableEl = e.target.closest('.coverable');
    if (coverableEl) { toggleElementCover(coverableEl); }
    return;
  }
});

// Close tag panel on outside click
document.addEventListener('click', (e) => {
  if (!tagPanelOpen) return;
  if (!e.target.closest('.tag-panel') && !e.target.closest('#tagGroup')) {
    closeTagPanel();
  }
});
</script>
